name: forgejo-source-audit

on:
  push:
    branches:
      - forgejo-runtime-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository tests and runtime gates
        run: |
          python -m unittest discover -s tests -v
          python -m aftermath_bench validate-runtimes

      - name: Fetch and verify pinned Forgejo source
        run: |
          python scripts/build_forgejo_runtime.py \
            --source-directory "$RUNNER_TEMP/forgejo" \
            --checkout \
            --build \
            --report "$RUNNER_TEMP/forgejo-source-verification.json"

      - name: Validate deterministic native reset
        run: |
          runtime_root="runtimes/forgejo/.runtime"
          mkdir -p "$runtime_root/validation"
          python scripts/manage_forgejo_stack.py up
          python scripts/manage_forgejo_stack.py setup
          python scripts/validate_forgejo_runtime.py seed \
            --credentials "$runtime_root/credentials.json" \
            --output "$runtime_root/validation/seed.json"
          python scripts/manage_forgejo_stack.py snapshot \
            --snapshot "$runtime_root/prefix.tar.gz"
          python scripts/validate_forgejo_runtime.py mutate \
            --credentials "$runtime_root/credentials.json" \
            --output "$runtime_root/validation/mutated.json"
          python scripts/manage_forgejo_stack.py restore \
            --snapshot "$runtime_root/prefix.tar.gz"
          python scripts/validate_forgejo_runtime.py verify-restored \
            --credentials "$runtime_root/credentials.json" \
            --output "$runtime_root/validation/restored.json"

      - name: Build the native recovery prefix
        run: |
          runtime_root="runtimes/forgejo/.runtime"
          python scripts/build_forgejo_prefix.py \
            --credentials "$runtime_root/credentials.json" \
            --output "$runtime_root/validation/release-prefix.json"

      - name: Capture native runtime diagnostics
        if: always()
        run: |
          runtime_root="runtimes/forgejo/.runtime"
          mkdir -p "$runtime_root/validation"
          docker compose \
            --project-name aftermath-forgejo \
            --file runtimes/forgejo/compose.yaml \
            ps --all > "$runtime_root/validation/compose-ps.txt" 2>&1 || true
          docker compose \
            --project-name aftermath-forgejo \
            --file runtimes/forgejo/compose.yaml \
            logs --no-color > "$runtime_root/validation/compose.log" 2>&1 || true
          docker inspect aftermath-forgejo-forgejo-1 \
            > "$runtime_root/validation/forgejo-inspect.json" 2>&1 || true

      - name: Remove runtime secrets and snapshot
        if: always()
        run: |
          rm -f runtimes/forgejo/.runtime/credentials.json
          rm -f runtimes/forgejo/.runtime/prefix.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forgejo-source-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/forgejo-source-verification.json
            runtimes/forgejo/.runtime/validation/
          if-no-files-found: error

      - name: Tear down native services
        if: always()
        run: python scripts/manage_forgejo_stack.py purge
