name: forgejo-migration-deployment-runtime

on:
  push:
    branches:
      - forgejo-migration-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      AFTERMATH_FORGEJO_ADMIN_PASSWORD: aftermath-admin
      INSTANCE: data/scenario_blueprints/forgejo-migration-deployment-dev-002/instance.json
      BLUEPRINT: data/scenario_blueprints/forgejo-migration-deployment-dev-002/scenario.json
      GENERATED_SCENARIO: data/scenarios/forgejo-migration-deployment-dev-002
      RUN_ROOT: runtimes/forgejo/.runtime/migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate migration family contracts
        run: |
          python -m unittest discover -s tests -p 'test_deployment_target.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_migration_blueprint.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_compose_spec.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_stack.py' -v

      - name: Build pinned Forgejo from audited source
        run: |
          mkdir -p "$RUN_ROOT"
          python scripts/build_forgejo_runtime.py \
            --source-directory "$RUNNER_TEMP/forgejo" \
            --checkout \
            --build \
            --report "$RUN_ROOT/source-verification.json"

      - name: Start source-built server and pinned open-source runner
        run: |
          python scripts/manage_forgejo_stack.py up
          python scripts/manage_forgejo_stack.py setup \
            --username aftermath \
            --email aftermath@aftermath.invalid
          python scripts/manage_forgejo_stack.py setup-runner

      - name: Build the successful persistent prefix
        run: |
          python scripts/build_forgejo_migration_prefix.py \
            --credentials runtimes/forgejo/.runtime/credentials.json \
            --instance-spec "$INSTANCE" \
            --output "$RUN_ROOT/prefix.json"
          python scripts/manage_forgejo_stack.py snapshot-migration-bundle \
            --snapshot "$RUN_ROOT/prefix-bundle"

      - name: Dispatch and verify a native Actions deployment
        run: |
          python scripts/validate_forgejo_migration_runtime.py \
            --credentials runtimes/forgejo/.runtime/credentials.json \
            --instance-spec "$INSTANCE" \
            --output "$RUN_ROOT/native-smoke.json"

      - name: Replay all four ambiguous dispatch boundaries
        run: |
          mkdir -p "$RUN_ROOT/state-evidence"
          variants=(
            dispatch_request_not_reached
            workflow_queued_runner_unavailable
            migration_applied_workflow_failed
            workflow_completed_dispatch_response_lost
          )
          for variant in "${variants[@]}"
          do
            python scripts/manage_forgejo_stack.py restore-migration-bundle \
              --snapshot "$RUN_ROOT/prefix-bundle"
            reset_evidence="$RUN_ROOT/state-evidence/$variant-reset.json"
            boundary_evidence="$RUN_ROOT/state-evidence/$variant-boundary.json"
            reference_start="$RUN_ROOT/state-evidence/$variant-reference-start.json"
            python scripts/capture_forgejo_migration_state_evidence.py \
              --phase reset \
              --scenario "$BLUEPRINT" \
              --instance-spec "$INSTANCE" \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --prefix "$RUN_ROOT/prefix.json" \
              --variant "$variant" \
              --bundle-manifest "$RUN_ROOT/prefix-bundle/bundle.json" \
              --forgejo-archive "$RUN_ROOT/prefix-bundle/forgejo-data.tar.gz" \
              --deployment-target-archive \
                "$RUN_ROOT/prefix-bundle/deployment-target-data.tar.gz" \
              --output "$reset_evidence"
            python scripts/run_forgejo_migration_boundary.py \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --instance-spec "$INSTANCE" \
              --variant "$variant" \
              --output "$RUN_ROOT/$variant-boundary.json"
            if [ "$variant" = workflow_queued_runner_unavailable ]
            then
              python scripts/manage_forgejo_stack.py snapshot-migration-bundle \
                --snapshot "$RUN_ROOT/$variant-bundle" \
                --runner-disabled
            else
              python scripts/manage_forgejo_stack.py snapshot-migration-bundle \
                --snapshot "$RUN_ROOT/$variant-bundle"
            fi
            python scripts/capture_forgejo_migration_state_evidence.py \
              --phase boundary \
              --scenario "$BLUEPRINT" \
              --instance-spec "$INSTANCE" \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --prefix "$RUN_ROOT/prefix.json" \
              --variant "$variant" \
              --bundle-manifest "$RUN_ROOT/$variant-bundle/bundle.json" \
              --forgejo-archive "$RUN_ROOT/$variant-bundle/forgejo-data.tar.gz" \
              --deployment-target-archive \
                "$RUN_ROOT/$variant-bundle/deployment-target-data.tar.gz" \
              --failure-report "$RUN_ROOT/$variant-boundary.json" \
              --reset-evidence "$reset_evidence" \
              --output "$boundary_evidence"
            python scripts/manage_forgejo_stack.py restore-migration-bundle \
              --snapshot "$RUN_ROOT/$variant-bundle"
            python scripts/capture_forgejo_migration_state_evidence.py \
              --phase boundary \
              --scenario "$BLUEPRINT" \
              --instance-spec "$INSTANCE" \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --prefix "$RUN_ROOT/prefix.json" \
              --variant "$variant" \
              --bundle-manifest "$RUN_ROOT/$variant-bundle/bundle.json" \
              --forgejo-archive "$RUN_ROOT/$variant-bundle/forgejo-data.tar.gz" \
              --deployment-target-archive \
                "$RUN_ROOT/$variant-bundle/deployment-target-data.tar.gz" \
              --failure-report "$RUN_ROOT/$variant-boundary.json" \
              --reset-evidence "$reset_evidence" \
              --output "$reference_start"
            python scripts/verify_forgejo_migration_boundary_replay.py \
              --boundary "$boundary_evidence" \
              --replay "$reference_start"
            python scripts/run_forgejo_migration_reference.py \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --prefix "$RUN_ROOT/prefix.json" \
              --instance-spec "$INSTANCE" \
              --variant "$variant" \
              --output "$RUN_ROOT/$variant-reference.json"
          done

      - name: Execute fixed recovery baselines on every boundary
        run: |
          variants=(
            dispatch_request_not_reached
            workflow_queued_runner_unavailable
            migration_applied_workflow_failed
            workflow_completed_dispatch_response_lost
          )
          baselines=(
            no_op
            assume_effect_complete
            blind_redispatch
            always_skip_migration
            always_restart_runner
            close_tracking_only
          )
          mkdir -p "$RUN_ROOT/baselines"
          for baseline in "${baselines[@]}"
          do
            for variant in "${variants[@]}"
            do
              python scripts/manage_forgejo_stack.py restore-migration-bundle \
                --snapshot "$RUN_ROOT/$variant-bundle"
              python scripts/run_forgejo_migration_baseline.py \
                --credentials runtimes/forgejo/.runtime/credentials.json \
                --prefix "$RUN_ROOT/prefix.json" \
                --instance-spec "$INSTANCE" \
                --variant "$variant" \
                --baseline "$baseline" \
                --output "$RUN_ROOT/baselines/$baseline-$variant.json"
            done
          done

      - name: Derive strict native hard admission
        run: |
          python scripts/build_forgejo_migration_admission.py \
            --runtime-directory "$RUN_ROOT" \
            --baseline-directory "$RUN_ROOT/baselines" \
            --blueprint "$BLUEPRINT" \
            --output-directory "$GENERATED_SCENARIO"

      - name: Publish admitted scenario to evidence branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force "$GENERATED_SCENARIO"
          git commit -m "data(forgejo): generate migration deployment evidence"
          git push --force origin \
            HEAD:refs/heads/generated/forgejo-migration-deployment-dev-002

      - name: Surface native logs on failure
        if: failure()
        run: |
          docker compose \
            --project-name aftermath-forgejo \
            --file runtimes/forgejo/compose.yaml \
            logs --no-color --tail 350 \
            forgejo runner-daemon deployment-target deployment-fault-gateway

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-migration-runtime
          path: |
            runtimes/forgejo/.runtime/migration
            data/scenarios/forgejo-migration-deployment-dev-002
