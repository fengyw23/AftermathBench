name: forgejo-migration-deployment-runtime

on:
  push:
    branches:
      - forgejo-migration-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      AFTERMATH_FORGEJO_ADMIN_PASSWORD: aftermath-admin
      INSTANCE: data/scenario_blueprints/forgejo-migration-deployment-dev-001/instance.json
      RUN_ROOT: runtimes/forgejo/.runtime/migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate migration family contracts
        run: |
          python -m unittest discover -s tests -p 'test_deployment_target.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_migration_blueprint.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_compose_spec.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_stack.py' -v

      - name: Build pinned Forgejo from audited source
        run: |
          mkdir -p "$RUN_ROOT"
          python scripts/build_forgejo_runtime.py \
            --source-directory "$RUNNER_TEMP/forgejo" \
            --checkout \
            --build \
            --report "$RUN_ROOT/source-verification.json"

      - name: Start source-built server and pinned open-source runner
        run: |
          python scripts/manage_forgejo_stack.py up
          python scripts/manage_forgejo_stack.py setup \
            --username aftermath \
            --email aftermath@aftermath.invalid
          python scripts/manage_forgejo_stack.py setup-runner

      - name: Build the successful persistent prefix
        run: |
          python scripts/build_forgejo_migration_prefix.py \
            --credentials runtimes/forgejo/.runtime/credentials.json \
            --instance-spec "$INSTANCE" \
            --output "$RUN_ROOT/prefix.json"
          python scripts/manage_forgejo_stack.py snapshot-migration-bundle \
            --snapshot "$RUN_ROOT/prefix-bundle"

      - name: Dispatch and verify a native Actions deployment
        run: |
          python scripts/validate_forgejo_migration_runtime.py \
            --credentials runtimes/forgejo/.runtime/credentials.json \
            --instance-spec "$INSTANCE" \
            --output "$RUN_ROOT/native-smoke.json"

      - name: Replay all four ambiguous dispatch boundaries
        run: |
          variants=(
            dispatch_request_not_reached
            workflow_queued_runner_unavailable
            migration_applied_workflow_failed
            workflow_completed_dispatch_response_lost
          )
          for variant in "${variants[@]}"
          do
            python scripts/manage_forgejo_stack.py restore-migration-bundle \
              --snapshot "$RUN_ROOT/prefix-bundle"
            python scripts/run_forgejo_migration_boundary.py \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --instance-spec "$INSTANCE" \
              --variant "$variant" \
              --output "$RUN_ROOT/$variant-boundary.json"
            if [ "$variant" = workflow_queued_runner_unavailable ]
            then
              python scripts/manage_forgejo_stack.py snapshot-migration-bundle \
                --snapshot "$RUN_ROOT/$variant-bundle" \
                --runner-disabled
            else
              python scripts/manage_forgejo_stack.py snapshot-migration-bundle \
                --snapshot "$RUN_ROOT/$variant-bundle"
            fi
            python scripts/manage_forgejo_stack.py restore-migration-bundle \
              --snapshot "$RUN_ROOT/$variant-bundle"
            python scripts/run_forgejo_migration_reference.py \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --prefix "$RUN_ROOT/prefix.json" \
              --instance-spec "$INSTANCE" \
              --variant "$variant" \
              --output "$RUN_ROOT/$variant-reference.json"
          done

      - name: Execute fixed recovery baselines on every boundary
        run: |
          variants=(
            dispatch_request_not_reached
            workflow_queued_runner_unavailable
            migration_applied_workflow_failed
            workflow_completed_dispatch_response_lost
          )
          baselines=(
            no_op
            assume_effect_complete
            blind_redispatch
            always_skip_migration
            always_restart_runner
            close_tracking_only
          )
          mkdir -p "$RUN_ROOT/baselines"
          for baseline in "${baselines[@]}"
          do
            for variant in "${variants[@]}"
            do
              python scripts/manage_forgejo_stack.py restore-migration-bundle \
                --snapshot "$RUN_ROOT/$variant-bundle"
              python scripts/run_forgejo_migration_baseline.py \
                --credentials runtimes/forgejo/.runtime/credentials.json \
                --prefix "$RUN_ROOT/prefix.json" \
                --instance-spec "$INSTANCE" \
                --variant "$variant" \
                --baseline "$baseline" \
                --output "$RUN_ROOT/baselines/$baseline-$variant.json"
            done
          done

      - name: Surface native logs on failure
        if: failure()
        run: |
          docker compose \
            --project-name aftermath-forgejo \
            --file runtimes/forgejo/compose.yaml \
            logs --no-color --tail 350 \
            forgejo runner-daemon deployment-target deployment-fault-gateway

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-migration-runtime
          path: runtimes/forgejo/.runtime/migration
