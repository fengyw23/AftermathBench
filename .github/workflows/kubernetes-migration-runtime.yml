name: kubernetes-migration-runtime

on:
  push:
    branches:
      - native-hard-recovery-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-native-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Run deterministic tests
        run: |
          python -m unittest discover -s tests -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned kind from source
        run: |
          git clone --no-checkout \
            https://github.com/kubernetes-sigs/kind.git \
            "$RUNNER_TEMP/kind"
          git -C "$RUNNER_TEMP/kind" fetch --depth 1 origin \
            9a205e8c8540557602240f8766d3c95c51c23c4c
          git -C "$RUNNER_TEMP/kind" checkout --detach FETCH_HEAD
          python scripts/verify_kubernetes_sources.py \
            --kind-source "$RUNNER_TEMP/kind" \
            --output "$RUNNER_TEMP/kubernetes-source-verification.json"
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/kind" && go build -trimpath -o "$RUNNER_TEMP/bin/kind" .)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install pinned kubectl
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/kubectl.sha256" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/bin/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/kubectl"

      - name: Start cluster, worker image and registry receiver
        run: |
          python scripts/manage_kubernetes_stack.py up
          docker build \
            --file runtimes/forgejo/control/Containerfile \
            --tag aftermathbench/kubernetes-control:local .
          kind load docker-image --name aftermath-kubernetes aftermathbench/kubernetes-control:local
          docker run --detach --rm \
            --name aftermath-migration-registry \
            --publish 127.0.0.1:9092:8080 \
            aftermathbench/kubernetes-control:local \
            python -m runtime_services.webhook_sink
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9092/health && break
            if [ "$attempt" = 30 ]; then
              docker logs aftermath-migration-registry || true
              exit 1
            fi
            sleep 1
          done

      - name: Replay four directional boundaries and references
        run: |
          run_root="$RUNNER_TEMP/kubernetes-migration"
          mkdir -p "$run_root/runtime" "$run_root/baselines"
          variants=(
            change_request_not_reached
            preparation_escaped_migration_failed
            schema_committed_cutover_pending
            cutover_and_publication_committed
          )
          for variant in "${variants[@]}"; do
            python scripts/run_kubernetes_migration_boundary.py \
              --variant "$variant" \
              --output "$run_root/runtime/$variant.json" \
              --prefix-output "$run_root/runtime/prefix.json"
            python scripts/run_kubernetes_migration_control.py \
              --variant "$variant" \
              --output "$run_root/runtime/$variant-reference.json"
          done
          python scripts/validate_kubernetes_migration_replay.py \
            --run-directory "$run_root/runtime" \
            --output "$run_root/runtime/replay-audit.json"

      - name: Execute fixed direction policies
        run: |
          run_root="$RUNNER_TEMP/kubernetes-migration"
          variants=(
            change_request_not_reached
            preparation_escaped_migration_failed
            schema_committed_cutover_pending
            cutover_and_publication_committed
          )
          baselines=(
            no_op blind_retry always_rollback always_compensate
            always_forward always_repair_downstream
          )
          for baseline in "${baselines[@]}"; do
            for variant in "${variants[@]}"; do
              python scripts/run_kubernetes_migration_boundary.py \
                --variant "$variant" \
                --output "$run_root/baselines/$baseline-$variant-boundary.json"
              python scripts/run_kubernetes_migration_baseline.py \
                --baseline "$baseline" \
                --variant "$variant" \
                --output "$run_root/baselines/$baseline-$variant.json"
            done
          done
          python scripts/summarize_native_baselines.py \
            --run-directory "$run_root/baselines" \
            --scenario data/scenario_blueprints/k8s-schema-rollout-dev-003/scenario.json \
            --output "$run_root/baselines/summary.json"

      - name: Capture diagnostics
        if: always()
        run: |
          run_root="$RUNNER_TEMP/kubernetes-migration"
          mkdir -p "$run_root/diagnostics"
          kind export logs "$run_root/diagnostics" --name aftermath-kubernetes || true
          kubectl --context kind-aftermath-kubernetes get all --all-namespaces -o wide \
            > "$run_root/diagnostics/all.txt" 2>&1 || true
          kubectl --context kind-aftermath-kubernetes get events --all-namespaces \
            > "$run_root/diagnostics/events.txt" 2>&1 || true

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-migration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kubernetes-source-verification.json
            ${{ runner.temp }}/kubernetes-migration

      - name: Purge native services
        if: always()
        run: |
          docker rm --force aftermath-migration-registry || true
          python scripts/manage_kubernetes_stack.py down || true
