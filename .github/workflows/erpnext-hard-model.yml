name: erpnext-native-hard-model

on:
  workflow_dispatch:
    inputs:
      split:
        description: Native scenario instance
        required: true
        default: development
        type: choice
        options:
          - development
          - holdout
      model:
        description: OpenAI-compatible model identifier
        required: true
        default: glm-5.2
        type: string
      repetitions:
        description: Repetitions for each matched hidden state
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  run-hard-model:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: src
      AFTERMATH_DB_ROOT_PASSWORD: aftermath-root
      AFTERMATH_ADMIN_PASSWORD: aftermath-admin
      AFTERMATH_API_KEY: ${{ secrets.ZHIPU_CODING_API_KEY }}
      AFTERMATH_MODEL_BASE_URL: https://open.bigmodel.cn/api/coding/paas/v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select and validate the scenario
        run: |
          test -n "$AFTERMATH_API_KEY"
          if [ "${{ inputs.split }}" = "holdout" ]
          then
            scenario_id=erpnext-partial-return-holdout-001
          else
            scenario_id=erpnext-partial-return-dev-001
          fi
          scenario="data/scenarios/${scenario_id}/scenario.json"
          test -f "$scenario"
          echo "SCENARIO_ID=$scenario_id" >> "$GITHUB_ENV"
          echo "SCENARIO=$scenario" >> "$GITHUB_ENV"
          python -m unittest discover -s tests -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned ERPNext and Frappe from source
        run: |
          python scripts/build_erpnext_runtime.py \
            --source-directory "$RUNNER_TEMP/frappe_docker" \
            --execute

      - name: Build and freeze the native prefix
        run: |
          run_root="runtimes/erpnext/.runtime/hard-model"
          mkdir -p "$run_root/model-runs"
          python scripts/manage_erpnext_stack.py up
          python scripts/manage_erpnext_stack.py setup
          python scripts/build_erpnext_return_prefix.py \
            --scenario "$SCENARIO" \
            --credentials runtimes/erpnext/.runtime/credentials.json \
            --output "$run_root/prefix.json"
          python scripts/manage_erpnext_stack.py snapshot \
            --snapshot "$run_root/prefix.sql"
          {
            echo "schema_version=0.1"
            echo "scenario_id=$SCENARIO_ID"
            echo "scenario_sha256=$(sha256sum "$SCENARIO" | cut -d' ' -f1)"
            echo "prefix_sha256=$(sha256sum "$run_root/prefix.json" | cut -d' ' -f1)"
            echo "snapshot_sha256=$(sha256sum "$run_root/prefix.sql" | cut -d' ' -f1)"
            echo "model=${{ inputs.model }}"
            echo "repetitions=${{ inputs.repetitions }}"
            echo "commit=$GITHUB_SHA"
          } > "$run_root/model-runs/manifest.txt"

      - name: Run the model on all matched hidden states
        run: |
          run_status=0
          run_root="runtimes/erpnext/.runtime/hard-model"
          variants=(
            request_not_reached
            database_committed_response_lost
            after_commit_enqueue_failed
            async_job_pending
          )
          for repetition in $(seq 1 "${{ inputs.repetitions }}")
          do
            run_dir="$run_root/model-runs/repetition-$(printf '%02d' "$repetition")"
            mkdir -p "$run_dir"
            for variant in "${variants[@]}"
            do
              failure_report="$run_dir/${variant}-failure.json"
              trajectory="$run_dir/${variant}.json"
              if python scripts/run_erpnext_return_failure.py \
                  --variant "$variant" \
                  --credentials runtimes/erpnext/.runtime/credentials.json \
                  --prefix "$run_root/prefix.json" \
                  --snapshot "$run_root/prefix.sql" \
                  --output "$failure_report"
              then
                if python -m aftermath_bench run-native-model \
                    --provider openai-compatible \
                    --base-url "$AFTERMATH_MODEL_BASE_URL" \
                    --model "${{ inputs.model }}" \
                    --scenario "$SCENARIO" \
                    --credentials runtimes/erpnext/.runtime/credentials.json \
                    --prefix "$run_root/prefix.json" \
                    --failure-report "$failure_report" \
                    --max-turns 15 \
                    --output "$trajectory"
                then
                  true
                elif [ ! -s "$trajectory" ]
                then
                  run_status=1
                fi
              else
                run_status=1
              fi
            done
          done
          python scripts/summarize_native_model_runs.py \
            --run-directory "$run_root/model-runs" \
            --output "$run_root/model-runs/summary.json" \
            || run_status=1
          exit "$run_status"

      - name: Capture compose diagnostics
        if: always()
        run: |
          run_root="runtimes/erpnext/.runtime/hard-model"
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            ps --all > "$run_root/compose-ps.txt" 2>&1 || true
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            logs --no-color > "$run_root/compose.log" 2>&1 || true

      - name: Remove credentials and database dump
        if: always()
        run: |
          rm -f runtimes/erpnext/.runtime/credentials.json
          rm -f runtimes/erpnext/.runtime/hard-model/prefix.sql

      - name: Upload sanitized trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-hard-${{ inputs.split }}-${{ inputs.model }}
          include-hidden-files: true
          path: |
            runtimes/erpnext/.runtime/hard-model/model-runs/
            runtimes/erpnext/.runtime/hard-model/prefix.json
            runtimes/erpnext/.runtime/hard-model/compose-ps.txt
            runtimes/erpnext/.runtime/hard-model/compose.log
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        run: python scripts/manage_erpnext_stack.py purge
