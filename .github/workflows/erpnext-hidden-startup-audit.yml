name: erpnext-hidden-startup-audit

on:
  push:
    branches:
      - erpnext-hidden-startup-audit

permissions:
  actions: read
  contents: read

jobs:
  audit-encrypted-startup-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      credential_smoke_present: ${{ steps.aggregate.outputs.credential_smoke_present }}
      credential_smoke_passed: ${{ steps.aggregate.outputs.credential_smoke_passed }}
      boundary_bundle_count: ${{ steps.aggregate.outputs.boundary_bundle_count }}
      site_config_bound_bundle_count: ${{ steps.aggregate.outputs.site_config_bound_bundle_count }}
      attempt_log_count: ${{ steps.aggregate.outputs.attempt_log_count }}
      trajectory_count: ${{ steps.aggregate.outputs.trajectory_count }}
    env:
      SOURCE_RUN_ID: "30790567945"
      SOURCE_ARTIFACT_ID: "8846971405"
      SOURCE_ARTIFACT_NAME: erpnext-hidden-consumed-30790567945
      SOURCE_ARTIFACT_DIGEST: sha256:2d2dc092fe2c5b377cdbab1954fd3473da7866254ab92bd62bce426a9a24da2d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify the encrypted evaluation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/hidden-startup-artifact"
          mkdir -p "$artifact_root"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            > "$RUNNER_TEMP/source-artifact.json"
          python - "$RUNNER_TEMP/source-artifact.json" <<'PY'
          import json
          import os
          import sys

          artifact = json.load(open(sys.argv[1], encoding="utf-8"))
          checks = {
              "id": int(artifact["id"]) == int(os.environ["SOURCE_ARTIFACT_ID"]),
              "name": artifact["name"] == os.environ["SOURCE_ARTIFACT_NAME"],
              "digest": artifact.get("digest") == os.environ["SOURCE_ARTIFACT_DIGEST"],
              "run": int(artifact["workflow_run"]["id"]) == int(os.environ["SOURCE_RUN_ID"]),
              "not_expired": not artifact["expired"],
          }
          failures = [name for name, passed in checks.items() if not passed]
          if failures:
              raise SystemExit(f"source artifact verification failed: {failures}")
          print(json.dumps({"source_artifact_verification": checks}))
          PY
          gh run download "$SOURCE_RUN_ID" \
            --name "$SOURCE_ARTIFACT_NAME" \
            --dir "$artifact_root"

      - name: Decrypt privately and emit aggregate startup facts
        id: aggregate
        env:
          HIDDEN_BUNDLE_ENCRYPTION_KEY: ${{ secrets.HIDDEN_BUNDLE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$HIDDEN_BUNDLE_ENCRYPTION_KEY"
          artifact_root="$RUNNER_TEMP/hidden-startup-artifact"
          audit_root="$RUNNER_TEMP/hidden-startup-audit"
          unseal_root="$RUNNER_TEMP/hidden-startup-unsealed"
          archive="$RUNNER_TEMP/hidden-startup-private.tar.gz"
          mkdir -p "$audit_root/public" "$unseal_root"
          sha256sum "$artifact_root/consumed-bundle.tar.gz.enc" \
            | cut -d' ' -f1 > "$audit_root/public/ciphertext-sha256.txt"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:HIDDEN_BUNDLE_ENCRYPTION_KEY \
            -in "$artifact_root/consumed-bundle.tar.gz.enc" \
            -out "$archive"
          PYTHONPATH=src python scripts/extract_sealed_hidden_bundle.py \
            --archive "$archive" --destination "$unseal_root"
          rm -f "$archive"
          PYTHONPATH=src python scripts/audit_erpnext_hidden_startup_failure.py \
            --private-root "$unseal_root/private" \
            --output "$audit_root/public/startup-audit.json"
          python - "$audit_root/public/startup-audit.json" <<'PY'
          import json
          import os
          import sys

          facts = json.load(open(sys.argv[1], encoding="utf-8"))
          names = (
              "credential_smoke_present",
              "credential_smoke_passed",
              "boundary_bundle_count",
              "site_config_bound_bundle_count",
              "attempt_log_count",
              "trajectory_count",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name in names:
                  value = facts[name]
                  if isinstance(value, bool):
                      value = str(value).lower()
                  output.write(f"{name}={value}\n")
          PY

      - name: Upload redacted startup audit only
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-hidden-startup-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/hidden-startup-audit/public/
          if-no-files-found: error
          retention-days: 90

      - name: Purge plaintext and encrypted inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/hidden-startup-unsealed"
          rm -rf "$RUNNER_TEMP/hidden-startup-artifact"
          rm -f "$RUNNER_TEMP/hidden-startup-private.tar.gz"

  publish-aggregate-verdict:
    needs: audit-encrypted-startup-failure
    name: >-
      smoke-present-${{ needs.audit-encrypted-startup-failure.outputs.credential_smoke_present }}
      smoke-pass-${{ needs.audit-encrypted-startup-failure.outputs.credential_smoke_passed }}
      bundles-${{ needs.audit-encrypted-startup-failure.outputs.boundary_bundle_count }}
      site-config-${{ needs.audit-encrypted-startup-failure.outputs.site_config_bound_bundle_count }}
      attempts-${{ needs.audit-encrypted-startup-failure.outputs.attempt_log_count }}
      trajectories-${{ needs.audit-encrypted-startup-failure.outputs.trajectory_count }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm aggregate report publication
        run: echo "The job name contains the redacted startup audit facts."
