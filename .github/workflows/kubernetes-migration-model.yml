name: kubernetes-migration-model

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible model identifier
        required: true
        default: glm-5.2
        type: string
      repetitions:
        description: Repetitions for each matched state
        required: true
        default: "1"
        type: string
      execution_control:
        description: Supply recovery procedure hints to isolate execution
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-migration-model:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      AFTERMATH_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
      AFTERMATH_MODEL_BASE_URL: https://ws-ogjwl5f71op9q2jf.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      SCENARIO: data/scenario_blueprints/k8s-schema-rollout-dev-003/scenario.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
      - name: Select experiment condition
        run: |
          test -n "$AFTERMATH_API_KEY"
          echo "MODEL_ID=${{ inputs.model }}" >> "$GITHUB_ENV"
          echo "REPETITIONS=${{ inputs.repetitions }}" >> "$GITHUB_ENV"
          echo "EXECUTION_CONTROL=${{ inputs.execution_control }}" >> "$GITHUB_ENV"
          python -m unittest discover -s tests -v
      - name: Build kind and install kubectl
        run: |
          git clone --no-checkout https://github.com/kubernetes-sigs/kind.git "$RUNNER_TEMP/kind"
          git -C "$RUNNER_TEMP/kind" fetch --depth 1 origin 9a205e8c8540557602240f8766d3c95c51c23c4c
          git -C "$RUNNER_TEMP/kind" checkout --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/kind" && go build -trimpath -o "$RUNNER_TEMP/bin/kind" .)
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Start native services
        run: |
          python scripts/manage_kubernetes_stack.py up
          docker build --file runtimes/forgejo/control/Containerfile \
            --tag aftermathbench/kubernetes-control:local .
          kind load docker-image --name aftermath-kubernetes aftermathbench/kubernetes-control:local
          docker run --detach --rm --name aftermath-migration-registry \
            --publish 127.0.0.1:9092:8080 aftermathbench/kubernetes-control:local \
            python -m runtime_services.webhook_sink
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9092/health && break
            sleep 1
          done
          run_root="$RUNNER_TEMP/kubernetes-migration-model"
          mkdir -p "$run_root/model-runs"
          printf '{}\n' > "$run_root/credentials.json"
      - name: Run model on four directional boundaries
        run: |
          run_status=0
          run_root="$RUNNER_TEMP/kubernetes-migration-model"
          variants=(
            change_request_not_reached
            preparation_escaped_migration_failed
            schema_committed_cutover_pending
            cutover_and_publication_committed
          )
          for repetition in $(seq 1 "$REPETITIONS"); do
            run_dir="$run_root/model-runs/repetition-$(printf '%02d' "$repetition")"
            mkdir -p "$run_dir"
            for variant in "${variants[@]}"; do
              python scripts/run_kubernetes_migration_boundary.py \
                --variant "$variant" \
                --prefix-output "$run_root/prefix.json" \
                --output "$run_dir/${variant}-failure.json"
              control_flag=()
              if [ "$EXECUTION_CONTROL" = "true" ]; then control_flag=(--execution-control); fi
              if python -m aftermath_bench run-native-model \
                  --provider openai-compatible \
                  --base-url "$AFTERMATH_MODEL_BASE_URL" \
                  --model "$MODEL_ID" \
                  --scenario "$SCENARIO" \
                  --credentials "$run_root/credentials.json" \
                  --prefix "$run_root/prefix.json" \
                  --failure-report "$run_dir/${variant}-failure.json" \
                  --max-turns 25 "${control_flag[@]}" \
                  --output "$run_dir/${variant}.json"; then
                true
              elif [ ! -s "$run_dir/${variant}.json" ]; then
                run_status=1
              fi
            done
          done
          python scripts/summarize_native_model_runs.py \
            --run-directory "$run_root/model-runs" \
            --scenario "$SCENARIO" \
            --output "$run_root/model-runs/summary.json" \
            --expected-execution-control "$EXECUTION_CONTROL" || run_status=1
          exit "$run_status"
      - name: Upload model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-migration-model-output
          path: ${{ runner.temp }}/kubernetes-migration-model/
      - name: Purge native services
        if: always()
        run: |
          docker rm --force aftermath-migration-registry || true
          python scripts/manage_kubernetes_stack.py down || true
