name: erpnext-cross-run-credential-smoke

on:
  push:
    branches:
      - erpnext-cross-run-credential-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-on-one-stack-and-restore-on-another:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      AFTERMATH_DB_ROOT_PASSWORD: aftermath-root
      AFTERMATH_ADMIN_PASSWORD: aftermath-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the pinned native ERPNext runtime
        run: |
          set -euo pipefail
          python scripts/build_erpnext_runtime.py \
            --source-directory "$RUNNER_TEMP/frappe_docker" \
            --execute --report "$RUNNER_TEMP/source-verification.json" \
            > "$RUNNER_TEMP/source-build.log" 2>&1

      - name: Create the source stack and snapshot its authenticated state
        run: |
          set -euo pipefail
          python scripts/manage_erpnext_stack.py up
          python scripts/manage_erpnext_stack.py setup
          cp runtimes/erpnext/.runtime/credentials.json \
            "$RUNNER_TEMP/source-credentials.json"
          python scripts/verify_erpnext_credentials.py \
            --credentials "$RUNNER_TEMP/source-credentials.json"
          python scripts/manage_erpnext_stack.py snapshot-bundle \
            --snapshot "$RUNNER_TEMP/cross-run-boundary"
          python - "$RUNNER_TEMP/cross-run-boundary" <<'PY'
          import json
          import sys
          from pathlib import Path

          bundle = Path(sys.argv[1])
          manifest = json.loads((bundle / "bundle.json").read_text())
          crypto = json.loads((bundle / "site-crypto.json").read_text())
          assert manifest["schema_version"] == "1.2"
          assert set(manifest["files"]) == {
              "database",
              "site_crypto",
              "redis_queue",
              "gateway_audit",
              "remittance_audit",
          }
          assert set(crypto) == {"encryption_key"}
          assert isinstance(crypto["encryption_key"], str) and crypto["encryption_key"]
          print('{"snapshot_schema":"1.2","minimal_crypto_material":true}')
          PY

      - name: Destroy every mutable volume and create an independent stack
        run: |
          set -euo pipefail
          python scripts/manage_erpnext_stack.py purge
          test ! -d runtimes/erpnext/.runtime || \
            rm -f runtimes/erpnext/.runtime/credentials.json
          python scripts/manage_erpnext_stack.py up

      - name: Restore the old boundary and authenticate with the old token
        run: |
          set -euo pipefail
          python scripts/manage_erpnext_stack.py restore-bundle \
            --snapshot "$RUNNER_TEMP/cross-run-boundary"
          python scripts/verify_erpnext_credentials.py \
            --credentials "$RUNNER_TEMP/source-credentials.json" \
            > "$RUNNER_TEMP/credential-result.json"
          python - "$RUNNER_TEMP/credential-result.json" <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          assert result == {
              "schema_version": "1.0",
              "passed": True,
              "credential_values_published": False,
              "document_content_published": False,
          }
          print('{"cross_run_restore":true,"old_token_authentication":true}')
          PY

      - name: Purge runtime state and credentials
        if: always()
        run: |
          python scripts/manage_erpnext_stack.py purge || true
          rm -rf "$RUNNER_TEMP/cross-run-boundary"
          rm -f "$RUNNER_TEMP/source-credentials.json"
          rm -f "$RUNNER_TEMP/credential-result.json"

