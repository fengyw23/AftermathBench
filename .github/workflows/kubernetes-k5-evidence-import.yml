name: kubernetes-k5-evidence-import

# Import is deliberately inert until a reviewed declaration names one
# completed K4 run. It never receives a provider credential and it does
# not edit the release manifest: the imported evidence and generated binding
# candidate remain subject to an independent release review.
on:
  push:
    branches:
      - native-hard-recovery-v1
    paths:
      - "data/control_gates/kubernetes-public-dev-slot-003-k5-import.json"

permissions:
  actions: read
  contents: write

concurrency:
  group: kubernetes-k5-evidence-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-reviewed-k4-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      GATE_PATH: data/control_gates/kubernetes-public-dev-slot-003-k5-import.json
      GENERATED_ROOT: data/generated/public-dev-slot-003
      SCENARIO_ROOT: data/scenarios/public-dev-slot-003
      FORMAL_ROOT: >-
        data/evidence/formal/aftermathbench-2026.08-r1/kubernetes/k8s-constraint-interaction-recovery/dev-006
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate reviewed K5 declaration and completed K4 provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/validate_k5_evidence_import.py gate \
            --gate "$GATE_PATH" \
            --github-env "$GITHUB_ENV"
          gh api \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .k4_run_id "$GATE_PATH")" \
            > "$RUNNER_TEMP/k4-run.json"
          gh api \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .k4_run_id "$GATE_PATH")/artifacts?per_page=100" \
            > "$RUNNER_TEMP/k4-artifacts.json"
          python scripts/validate_k5_evidence_import.py provenance \
            --gate "$GATE_PATH" \
            --run-metadata "$RUNNER_TEMP/k4-run.json" \
            --artifacts-metadata "$RUNNER_TEMP/k4-artifacts.json" \
            --import-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/k5-import-provenance.json"

      - name: Download the immutable K4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/k4-artifact"
          gh run download "$K4_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$K4_ARTIFACT" \
            --dir "$RUNNER_TEMP/k4-artifact"

      - name: Verify artifact allowlist and aggregate scientific gate
        run: |
          stage="$RUNNER_TEMP/k4-artifact"
          python scripts/validate_k5_evidence_import.py artifact \
            --gate "$GATE_PATH" \
            --stage "$stage"
          python scripts/verify_public_evidence_safe.py \
            --root "$stage/generated/public-dev-slot-003" \
            --root "$stage/scenarios/public-dev-slot-003" \
            --root "$stage/evidence/formal/aftermathbench-2026.08-r1/kubernetes/k8s-constraint-interaction-recovery/dev-006"

      - name: Import repository-safe evidence and derive release binding candidate
        run: |
          stage="$RUNNER_TEMP/k4-artifact"
          test ! -e "$GENERATED_ROOT"
          test ! -e "$SCENARIO_ROOT"
          test ! -e "$FORMAL_ROOT"
          mkdir -p \
            "$(dirname "$GENERATED_ROOT")" \
            "$(dirname "$SCENARIO_ROOT")" \
            "$(dirname "$FORMAL_ROOT")"
          cp -a "$stage/generated/public-dev-slot-003" "$GENERATED_ROOT"
          cp -a "$stage/scenarios/public-dev-slot-003" "$SCENARIO_ROOT"
          cp -a \
            "$stage/evidence/formal/aftermathbench-2026.08-r1/kubernetes/k8s-constraint-interaction-recovery/dev-006" \
            "$FORMAL_ROOT"
          python scripts/generate_formal_release_binding.py \
            --scenario "$SCENARIO_ROOT/scenario.json" \
            --formal-declarations "$FORMAL_ROOT/completion/declarations.json" \
            --root . \
            --output "$GENERATED_ROOT/k5-release-binding-candidate.json" \
            > "$RUNNER_TEMP/k5-release-binding.log"
          cp \
            "$RUNNER_TEMP/k5-import-provenance.json" \
            "$GENERATED_ROOT/k5-import-provenance.json"
          python scripts/verify_public_evidence_safe.py \
            --root "$GENERATED_ROOT" \
            --root "$SCENARIO_ROOT" \
            --root "$FORMAL_ROOT"
          python -m aftermath_bench validate-native-scenario \
            --scenario "$SCENARIO_ROOT/scenario.json"

      - name: Commit only reviewed K5 evidence
        run: |
          git add -- "$GENERATED_ROOT" "$SCENARIO_ROOT" "$FORMAL_ROOT"
          test -n "$(git diff --cached --name-only)"
          if git status --porcelain --untracked-files=all \
              | grep -Ev '^(A |M |R |\?\?) (data/generated/public-dev-slot-003/|data/scenarios/public-dev-slot-003/|data/evidence/formal/aftermathbench-2026.08-r1/kubernetes/k8s-constraint-interaction-recovery/dev-006/)' \
              | grep -q .
          then
            echo "unexpected file outside K5 import allowlist" >&2
            git status --short
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "import reviewed Kubernetes K4 formal evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
