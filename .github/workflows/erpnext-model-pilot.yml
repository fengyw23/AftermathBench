name: erpnext-native-model-pilot

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible model identifier
        required: true
        default: glm-5.2
        type: string
      repetitions:
        description: Repetitions for each of the four matched states
        required: true
        default: "1"
        type: string

jobs:
  model-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      AFTERMATH_DB_ROOT_PASSWORD: aftermath-root
      AFTERMATH_ADMIN_PASSWORD: aftermath-admin
      AFTERMATH_API_KEY: ${{ secrets.ZHIPU_CODING_API_KEY }}
      AFTERMATH_MODEL_BASE_URL: https://open.bigmodel.cn/api/coding/paas/v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require the model API secret
        run: |
          test -n "$AFTERMATH_API_KEY"

      - name: Validate code before the expensive runtime build
        run: |
          python -m unittest discover -s tests -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned ERPNext and Frappe from source
        run: |
          python scripts/build_erpnext_runtime.py \
            --source-directory "$RUNNER_TEMP/frappe_docker" \
            --execute

      - name: Start native services and create the shared prefix
        run: |
          python scripts/manage_erpnext_stack.py up
          python scripts/manage_erpnext_stack.py setup
          python scripts/build_erpnext_prefix.py \
            --credentials runtimes/erpnext/.runtime/credentials.json \
            --output runtimes/erpnext/.runtime/prefix.json
          python scripts/manage_erpnext_stack.py snapshot \
            --snapshot runtimes/erpnext/.runtime/prefix.sql

      - name: Run the model on all matched hidden states
        run: |
          pilot_status=0
          mkdir -p runtimes/erpnext/.runtime/model-runs
          variants=(
            request_not_reached
            database_committed_response_lost
            after_commit_enqueue_failed
            async_job_pending
          )
          for repetition in $(seq 1 "${{ inputs.repetitions }}")
          do
            run_dir="runtimes/erpnext/.runtime/model-runs/repetition-$(printf '%02d' "$repetition")"
            mkdir -p "$run_dir"
            for variant in "${variants[@]}"
            do
              failure_report="$run_dir/${variant}-failure.json"
              trajectory="$run_dir/${variant}.json"
              if python scripts/run_erpnext_failure.py \
                  --variant "$variant" \
                  --credentials runtimes/erpnext/.runtime/credentials.json \
                  --prefix runtimes/erpnext/.runtime/prefix.json \
                  --snapshot runtimes/erpnext/.runtime/prefix.sql \
                  --output "$failure_report"
              then
                if python -m aftermath_bench run-erpnext-model \
                    --provider openai-compatible \
                    --base-url "$AFTERMATH_MODEL_BASE_URL" \
                    --model "${{ inputs.model }}" \
                    --variant "$variant" \
                    --credentials runtimes/erpnext/.runtime/credentials.json \
                    --prefix runtimes/erpnext/.runtime/prefix.json \
                    --failure-report "$failure_report" \
                    --output "$trajectory"
                then
                  true
                elif [ ! -s "$trajectory" ]
                then
                  pilot_status=1
                fi
              else
                pilot_status=1
              fi
            done
          done
          python scripts/summarize_erpnext_model_runs.py \
            --run-directory runtimes/erpnext/.runtime/model-runs \
            --output runtimes/erpnext/.runtime/model-runs/summary.json \
            || pilot_status=1
          exit "$pilot_status"

      - name: Capture compose diagnostics
        if: always()
        run: |
          mkdir -p runtimes/erpnext/.runtime
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            ps --all \
            > runtimes/erpnext/.runtime/compose-ps.txt 2>&1 || true
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            logs --no-color \
            > runtimes/erpnext/.runtime/compose.log 2>&1 || true

      - name: Remove ephemeral credentials
        if: always()
        run: rm -f runtimes/erpnext/.runtime/credentials.json

      - name: Upload sanitized model trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-native-${{ inputs.model }}-pilot
          include-hidden-files: true
          path: |
            runtimes/erpnext/.runtime/model-runs/
            runtimes/erpnext/.runtime/prefix.json
            runtimes/erpnext/.runtime/compose-ps.txt
            runtimes/erpnext/.runtime/compose.log
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        run: python scripts/manage_erpnext_stack.py purge
