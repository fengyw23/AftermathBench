name: forgejo-package-provenance-runtime

on:
  push:
    branches:
      - forgejo-package-provenance-runtime
  workflow_dispatch:
    inputs:
      generation:
        description: Package recovery generation to replay
        required: true
        default: r1
        type: choice
        options:
          - r1
          - r2

permissions:
  contents: read

jobs:
  replay-native-package-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      GENERATION: ${{ inputs.generation || 'r1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select frozen development instance
        run: |
          if [[ "$GENERATION" == "r2" ]]
          then
            echo "INSTANCE_SPEC=data/instance_specs/forgejo-package-provenance-nonmonotonic-dev-001.json" >> "$GITHUB_ENV"
            echo "BLUEPRINT=data/scenario_blueprints/forgejo-package-provenance-nonmonotonic-dev-001/scenario.json" >> "$GITHUB_ENV"
          else
            echo "INSTANCE_SPEC=data/instance_specs/forgejo-package-provenance-dev-001.json" >> "$GITHUB_ENV"
            echo "BLUEPRINT=data/scenario_blueprints/forgejo-package-provenance-dev-001/scenario.json" >> "$GITHUB_ENV"
          fi

      - name: Run focused deterministic tests
        run: |
          python -m unittest discover -s tests -p 'test_forgejo_api.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_package_provenance.py' -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned Forgejo from source
        run: |
          python scripts/build_forgejo_runtime.py \
            --source-directory "$RUNNER_TEMP/forgejo" \
            --checkout \
            --build \
            --report "$RUNNER_TEMP/forgejo-source-verification.json"

      - name: Build and freeze the package prefix
        run: |
          runtime_root="runtimes/forgejo/.runtime"
          run_root="$RUNNER_TEMP/forgejo-package-provenance"
          mkdir -p "$runtime_root" "$run_root/runtime"
          python scripts/manage_forgejo_stack.py up
          python scripts/manage_forgejo_stack.py setup
          python scripts/build_forgejo_package_provenance_prefix.py \
            --credentials "$runtime_root/credentials.json" \
            --instance-spec "$INSTANCE_SPEC" \
            --output "$run_root/runtime/prefix.json"
          python scripts/manage_forgejo_stack.py snapshot \
            --snapshot "$runtime_root/package-prefix.tar.gz"

      - name: Replay matched boundaries and reference recoveries
        run: |
          runtime_root="runtimes/forgejo/.runtime"
          run_root="$RUNNER_TEMP/forgejo-package-provenance"
          if [[ "$GENERATION" == "r2" ]]
          then
            variants=(
              r2_package_request_not_reached
              r2_package_binary_committed_response_lost
              r2_package_complete_index_missing
              r2_package_corrupt_binary_index_missing
            )
          else
            variants=(
              package_request_not_reached
              package_binary_committed_response_lost
              package_complete_index_missing
              package_complete_index_accepted_response_lost
            )
          fi
          for variant in "${variants[@]}"
          do
            python scripts/manage_forgejo_stack.py restore \
              --snapshot "$runtime_root/package-prefix.tar.gz"
            python scripts/run_forgejo_package_provenance_boundary.py \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$run_root/runtime/prefix.json" \
              --variant "$variant" \
              --output "$run_root/runtime/$variant-boundary.json"
            python scripts/run_forgejo_package_provenance_control.py \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$run_root/runtime/prefix.json" \
              --boundary "$run_root/runtime/$variant-boundary.json" \
              --output "$run_root/runtime/$variant-reference.json"
          done
          cp "$RUNNER_TEMP/forgejo-source-verification.json" \
            "$run_root/source-verification.json"

      - name: Replay fixed-policy baselines
        run: |
          runtime_root="runtimes/forgejo/.runtime"
          run_root="$RUNNER_TEMP/forgejo-package-provenance"
          if [[ "$GENERATION" == "r2" ]]
          then
            variants=(
              r2_package_request_not_reached
              r2_package_binary_committed_response_lost
              r2_package_complete_index_missing
              r2_package_corrupt_binary_index_missing
            )
          else
            variants=(
              package_request_not_reached
              package_binary_committed_response_lost
              package_complete_index_missing
              package_complete_index_accepted_response_lost
            )
          fi
          baselines=(
            no_op
            blind_full_publish
            assume_package_exists
            metadata_only
            replay_all_failed
            close_only
            inventory_diff_completion
          )
          mkdir -p "$run_root/baselines"
          for baseline in "${baselines[@]}"
          do
            for variant in "${variants[@]}"
            do
              python scripts/manage_forgejo_stack.py restore \
                --snapshot "$runtime_root/package-prefix.tar.gz"
              python scripts/run_forgejo_package_provenance_boundary.py \
                --credentials "$runtime_root/credentials.json" \
                --prefix "$run_root/runtime/prefix.json" \
                --variant "$variant" \
                --output "$run_root/runtime/$baseline-$variant-boundary.json"
              python scripts/run_forgejo_package_provenance_baseline.py \
                --credentials "$runtime_root/credentials.json" \
                --prefix "$run_root/runtime/prefix.json" \
                --boundary "$run_root/runtime/$baseline-$variant-boundary.json" \
                --baseline "$baseline" \
                --output "$run_root/baselines/$baseline-$variant.json"
            done
          done
          python scripts/summarize_native_baselines.py \
            --run-directory "$run_root/baselines" \
            --scenario "$BLUEPRINT" \
            --output "$run_root/baselines/summary.json"
          python - "$run_root/baselines/summary.json" <<'PY'
          import json
          import pathlib
          import sys

          summary = json.loads(pathlib.Path(sys.argv[1]).read_text())
          rates = [item["pass_rate"] for item in summary["heuristics"]]
          matched = [
              item["name"]
              for item in summary["heuristics"]
              if item["matched_group_success"]
          ]
          if max(rates, default=1.0) >= 0.5 or matched:
              raise SystemExit(
                  f"hard baseline gate failed: rates={rates}, matched={matched}"
              )
          PY
          python scripts/build_forgejo_package_provenance_admission.py \
            --runtime-directory "$run_root/runtime" \
            --baseline-directory "$run_root/baselines" \
            --blueprint "$BLUEPRINT" \
            --output-directory "$run_root/admitted"
          python scripts/build_evidence_file_manifest.py \
            --root "$run_root" \
            --output "$run_root/evidence-manifest.json"

      - name: Capture diagnostics and remove credentials
        if: always()
        run: |
          runtime_root="runtimes/forgejo/.runtime"
          run_root="$RUNNER_TEMP/forgejo-package-provenance"
          mkdir -p "$run_root"
          docker compose \
            --project-name aftermath-forgejo \
            --file runtimes/forgejo/compose.yaml \
            ps --all > "$run_root/compose-ps.txt" 2>&1 || true
          rm -f "$runtime_root/credentials.json"
          rm -f "$runtime_root/package-prefix.tar.gz"

      - name: Upload package-provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-package-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/forgejo-package-provenance
          if-no-files-found: error

      - name: Purge native services
        if: always()
        run: python scripts/manage_forgejo_stack.py purge || true
