name: kubernetes-interaction-public-dev-admission

on:
  push:
    branches:
      - native-hard-recovery-v1
    paths:
      - ".github/workflows/kubernetes-interaction-public-dev-admission.yml"
      - "data/instance_specs/public-dev-slot-003.json"
      - "data/scenario_blueprints/public-dev-slot-003/**"
      - "scripts/build_kubernetes_interaction_admission.py"
      - "scripts/run_kubernetes_interaction_*.py"
      - "scripts/summarize_kubernetes_interaction_runtime.py"
      - "scripts/summarize_native_baselines.py"
      - "scripts/verify_kubernetes_interaction_instance_novelty.py"
      - "scripts/verify_kubernetes_interaction_public_dev_admission.py"
      - "scripts/generate_kubernetes_interaction_formal_build_spec.py"
      - "scripts/build_formal_evidence.py"
      - "src/aftermath_bench/native_admission.py"
      - "src/aftermath_bench/native_baseline_summary.py"
      - "src/aftermath_bench/native_kubernetes_interaction_family.py"
      - "src/aftermath_bench/integrations/kubernetes_interaction_*.py"
      - "src/aftermath_bench/integrations/kubernetes_stack.py"
      - "src/aftermath_bench/kubernetes_interaction_formal_build_spec.py"
      - "src/aftermath_bench/native_formal_spec.py"
      - "src/aftermath_bench/formal_evidence_builder.py"
      - "tests/test_kubernetes_interaction*.py"
      - "tests/test_kubernetes_stack_bundle.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-interaction-public-dev-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-and-admit-public-development-instance:
    runs-on: ubuntu-latest
    # Exact replay now refreshes every persistent state consumer after each
    # etcd rewind. The 13 reference boundaries take about two hours and the
    # 117 native fixed-policy probes take another two, so the previous
    # 240-minute job limit cancelled a healthy run before admission and input
    # locking. Keep all checks intact and use GitHub's hosted-job maximum.
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      AFTERMATH_KUBERNETES_INTERACTION_INSTANCE_SPEC: >-
        data/instance_specs/public-dev-slot-003.json
      RUN_ROOT: data/generated/public-dev-slot-003
      NATIVE_ROOT: data/generated/public-dev-slot-003/native
      SCENARIO_DIRECTORY: >-
        data/scenarios/public-dev-slot-003
      FORMAL_OUTPUT: >-
        data/evidence/formal/aftermathbench-2026.08-r1/kubernetes/k8s-constraint-interaction-recovery/dev-006
      BENCHMARK_RELEASE_ID: aftermathbench-2026.08-r1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Validate fresh instance and admission code
        run: |
          python scripts/verify_kubernetes_interaction_instance_novelty.py \
            --instance-spec "$AFTERMATH_KUBERNETES_INTERACTION_INSTANCE_SPEC" \
            --bound-blueprint \
              data/scenario_blueprints/public-dev-slot-003/scenario.json
          unset AFTERMATH_KUBERNETES_INTERACTION_INSTANCE_SPEC
          python -m unittest discover \
            -s tests -p 'test_kubernetes_interaction*.py' -v
          python -m unittest discover \
            -s tests -p 'test_evidence_projection_witness.py' -v

      - name: Build pinned kind from source
        run: |
          git clone --no-checkout \
            https://github.com/kubernetes-sigs/kind.git "$RUNNER_TEMP/kind"
          git -C "$RUNNER_TEMP/kind" fetch --depth 1 origin \
            9a205e8c8540557602240f8766d3c95c51c23c4c
          git -C "$RUNNER_TEMP/kind" checkout --detach FETCH_HEAD
          python scripts/verify_kubernetes_sources.py \
            --kind-source "$RUNNER_TEMP/kind" \
            --output "$RUNNER_TEMP/kubernetes-source-verification.json"
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/kind" && \
            go build -trimpath -o "$RUNNER_TEMP/bin/kind" .)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install pinned kubectl
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/kubectl.sha256" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/bin/kubectl" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/kubectl"

      - name: Install checksum-pinned etcdutl
        run: |
          etcd_url="https://github.com/etcd-io/etcd/releases/download/v3.6.4/etcd-v3.6.4-linux-amd64.tar.gz"
          etcd_sha="4d5f3101daa534e45ccaf3eec8d21c19b7222db377bcfd5e5a9144155238c105"
          archive="$RUNNER_TEMP/etcd-v3.6.4-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" "$etcd_url"
          echo "$etcd_sha  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/etcd-v3.6.4-linux-amd64/etcdutl" \
            "$RUNNER_TEMP/bin/etcdutl"
          etcdutl version

      - name: Start native Kubernetes and durable external registry
        run: |
          python scripts/manage_kubernetes_stack.py up
          docker build --file runtimes/forgejo/control/Containerfile \
            --tag aftermathbench/kubernetes-control:local .
          kind load docker-image --name aftermath-kubernetes \
            aftermathbench/kubernetes-control:local
          registry_root="$RUNNER_TEMP/kubernetes-public-dev-registry"
          mkdir -p "$registry_root"
          docker run --detach \
            --name aftermath-interaction-registry \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1:9092:8080 \
            --mount "type=bind,src=$registry_root,dst=/data" \
            aftermathbench/kubernetes-control:local \
            python -m runtime_services.webhook_sink
          registry_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9092/health; then
              registry_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$registry_ready" != true ]]; then
            docker logs aftermath-interaction-registry
            exit 1
          fi

      - name: Install exact-replay mount before constructing boundaries
        run: python scripts/manage_kubernetes_stack.py prepare-snapshot-runtime

      - name: Replay thirteen exact native boundaries and references from one reset bundle
        run: |
          sensitive_root="$RUNNER_TEMP/kubernetes-public-dev-sensitive"
          registry_database="$RUNNER_TEMP/kubernetes-public-dev-registry/webhook-sink.sqlite3"
          test ! -e "$RUN_ROOT"
          mkdir -p \
            "$RUN_ROOT/logs" \
            "$RUN_ROOT/specs" \
            "$NATIVE_ROOT/runtime/state-evidence" \
            "$NATIVE_ROOT/runtime/bundle-manifests" \
            "$NATIVE_ROOT/baselines" \
            "$NATIVE_ROOT/bundles" \
            "$sensitive_root"
          diagnostic_log="$RUN_ROOT/logs/exact-boundary-replay.log"
          diagnostic_context="prepare-prefix"
          exec > >(tee -a "$diagnostic_log") 2>&1
          trap '
            status=$?
            if [[ "$status" -ne 0 ]]; then
              diagnostic=$(tail -c 1800 "$diagnostic_log" | tr "\n" " " | sed "s/%/%25/g")
              echo "::error title=Exact boundary replay failed ($diagnostic_context)::$diagnostic"
            fi
            trap - EXIT
            exit "$status"
          ' EXIT
          python scripts/run_kubernetes_interaction_boundary.py \
            --variant state_01 \
            --prepare-only \
            --prefix-output "$NATIVE_ROOT/runtime/prefix.json"
          reset_before_snapshot="$NATIVE_ROOT/runtime/state-evidence/reset-pre-snapshot.json"
          python scripts/capture_kubernetes_interaction_state_evidence.py \
            --variant state_01 \
            --output "$reset_before_snapshot"
          python scripts/manage_kubernetes_stack.py snapshot-bundle \
            --snapshot "$sensitive_root/prefix" \
            --registry-database "$registry_database"
          cp \
            "$sensitive_root/prefix/bundle.json" \
            "$NATIVE_ROOT/runtime/bundle-manifests/prefix.json"
          variants=(
            state_01 state_02 state_03 state_04 state_05 state_06 state_07
            state_08 state_09 state_10 state_11 state_12 state_13
          )
          for variant in "${variants[@]}"; do
            diagnostic_context="restore-prefix:$variant"
            python scripts/manage_kubernetes_stack.py restore-bundle \
              --snapshot "$sensitive_root/prefix" \
              --registry-database "$registry_database"
            reset="$NATIVE_ROOT/runtime/state-evidence/$variant-reset.json"
            python scripts/capture_kubernetes_interaction_state_evidence.py \
              --variant "$variant" \
              --phase reset \
              --prefix "$NATIVE_ROOT/runtime/prefix.json" \
              --bundle-manifest \
                "$NATIVE_ROOT/runtime/bundle-manifests/prefix.json" \
              --pre-snapshot-state "$reset_before_snapshot" \
              --wait-seconds 180 \
              --output "$reset"
            diagnostic_context="trigger-boundary:$variant"
            python scripts/run_kubernetes_interaction_boundary.py \
              --variant "$variant" \
              --trigger-only \
              --prefix-input "$NATIVE_ROOT/runtime/prefix.json" \
              --output "$NATIVE_ROOT/runtime/$variant-boundary.json"
            native_before_snapshot="$NATIVE_ROOT/runtime/state-evidence/$variant-pre-snapshot.json"
            boundary="$NATIVE_ROOT/runtime/state-evidence/$variant-boundary.json"
            reference_start="$NATIVE_ROOT/runtime/state-evidence/$variant-reference-start.json"
            bundle="$sensitive_root/boundary-$variant"
            python scripts/capture_kubernetes_interaction_state_evidence.py \
              --variant "$variant" \
              --output "$native_before_snapshot"
            diagnostic_context="snapshot-boundary:$variant"
            python scripts/manage_kubernetes_stack.py snapshot-bundle \
              --snapshot "$bundle" \
              --registry-database "$registry_database"
            cp \
              "$bundle/bundle.json" \
              "$NATIVE_ROOT/runtime/bundle-manifests/$variant.json"
            diagnostic_context="verify-boundary-restore:$variant"
            python scripts/manage_kubernetes_stack.py restore-bundle \
              --snapshot "$bundle" \
              --registry-database "$registry_database"
            python scripts/capture_kubernetes_interaction_state_evidence.py \
              --variant "$variant" \
              --phase boundary \
              --prefix "$NATIVE_ROOT/runtime/prefix.json" \
              --bundle-manifest \
                "$NATIVE_ROOT/runtime/bundle-manifests/$variant.json" \
              --reset-evidence "$reset" \
              --failure-report "$NATIVE_ROOT/runtime/$variant-boundary.json" \
              --pre-snapshot-state "$native_before_snapshot" \
              --wait-seconds 180 \
              --output "$boundary"
            diagnostic_context="verify-reference-start:$variant"
            python scripts/manage_kubernetes_stack.py restore-bundle \
              --snapshot "$bundle" \
              --registry-database "$registry_database"
            python scripts/capture_kubernetes_interaction_state_evidence.py \
              --variant "$variant" \
              --phase boundary \
              --prefix "$NATIVE_ROOT/runtime/prefix.json" \
              --bundle-manifest \
                "$NATIVE_ROOT/runtime/bundle-manifests/$variant.json" \
              --reset-evidence "$reset" \
              --failure-report "$NATIVE_ROOT/runtime/$variant-boundary.json" \
              --pre-snapshot-state "$native_before_snapshot" \
              --expected "$boundary" \
              --wait-seconds 180 \
              --output "$reference_start"
            diagnostic_context="run-reference:$variant"
            python scripts/run_kubernetes_interaction_control.py \
              --variant "$variant" \
              --output "$NATIVE_ROOT/runtime/$variant-reference.json"
          done
          python scripts/summarize_kubernetes_interaction_runtime.py \
            --run-directory "$NATIVE_ROOT/runtime" \
            --output "$NATIVE_ROOT/runtime-summary.json" \
            --projection-output "$NATIVE_ROOT/projection-witnesses.json"

      - name: Replay 117 fixed policies from byte-locked native boundaries
        run: |
          mkdir -p \
            "$NATIVE_ROOT/baselines/pre-state" \
            "$NATIVE_ROOT/baselines/boundary-reports"
          variants=(
            state_01 state_02 state_03 state_04 state_05 state_06 state_07
            state_08 state_09 state_10 state_11 state_12 state_13
          )
          baselines=(
            no_op blind_retry always_abort always_compensate_abort
            always_defer_new_owner always_forward_new_owners
            always_publish_new_owner close_only compact_epoch_external_tree
          )
          for baseline in "${baselines[@]}"; do
            for variant in "${variants[@]}"; do
              boundary="$NATIVE_ROOT/baselines/pre-state/$baseline-$variant-boundary.json"
              pre_state="$NATIVE_ROOT/baselines/pre-state/$baseline-$variant.json"
              python scripts/run_kubernetes_interaction_boundary.py \
                --variant "$variant" \
                --prefix-output "$NATIVE_ROOT/baselines/prefix.json" \
                --output \
                  "$NATIVE_ROOT/baselines/boundary-reports/$baseline-$variant.json"
              python scripts/capture_kubernetes_interaction_state_evidence.py \
                --variant "$variant" \
                --output "$boundary"
              python scripts/capture_kubernetes_interaction_state_evidence.py \
                --variant "$variant" \
                --expected "$boundary" \
                --wait-seconds 30 \
                --output "$pre_state"
              python scripts/run_kubernetes_interaction_baseline.py \
                --baseline "$baseline" \
                --variant "$variant" \
                --output "$NATIVE_ROOT/baselines/$baseline-$variant.json"
            done
          done
          python scripts/summarize_native_baselines.py \
            --run-directory "$NATIVE_ROOT/baselines" \
            --scenario \
              data/scenario_blueprints/public-dev-slot-003/scenario.json \
            --output "$NATIVE_ROOT/baselines/summary.json"

      - name: Build and verify replay-derived hard admission
        run: |
          python scripts/build_kubernetes_interaction_admission.py \
            --run-directory "$NATIVE_ROOT" \
            --blueprint \
              data/scenario_blueprints/public-dev-slot-003/scenario.json \
            --output-directory "$NATIVE_ROOT/admitted-scenario"
          python -m aftermath_bench validate-native-scenario \
            --scenario "$NATIVE_ROOT/admitted-scenario/scenario.json"
          python \
            scripts/verify_kubernetes_interaction_public_dev_admission.py \
            --run-directory "$NATIVE_ROOT" \
            --output "$NATIVE_ROOT/public-dev-admission-verification.json"
          if [ -d "$SCENARIO_DIRECTORY" ]; then
            diff --recursive "$SCENARIO_DIRECTORY" "$NATIVE_ROOT/admitted-scenario"
          else
            mkdir -p "$(dirname "$SCENARIO_DIRECTORY")"
            cp -R "$NATIVE_ROOT/admitted-scenario" "$SCENARIO_DIRECTORY"
          fi
          cp \
            "$RUNNER_TEMP/kubernetes-source-verification.json" \
            "$NATIVE_ROOT/runtime/source-verification.json"
          python scripts/build_evidence_file_manifest.py \
            --root "$NATIVE_ROOT" \
            --output "$NATIVE_ROOT/files.json"

      - name: Freeze the five formal input roles without provider access
        run: |
          capture_args=(
            --capture-bundle-manifest \
              "$NATIVE_ROOT/runtime/bundle-manifests/prefix.json"
          )
          for variant in \
            state_01 state_02 state_03 state_04 state_05 state_06 state_07 \
            state_08 state_09 state_10 state_11 state_12 state_13
          do
            capture_args+=(
              --capture-bundle-manifest \
                "$NATIVE_ROOT/runtime/bundle-manifests/$variant.json"
            )
          done
          python scripts/generate_kubernetes_interaction_formal_build_spec.py \
            --phase inputs \
            --benchmark-release-id "$BENCHMARK_RELEASE_ID" \
            --scenario "$SCENARIO_DIRECTORY/scenario.json" \
            --runtime-manifest "$NATIVE_ROOT/files.json" \
            --capture-directory "$NATIVE_ROOT/runtime/state-evidence" \
            "${capture_args[@]}" \
            --formal-output-directory "$FORMAL_OUTPUT" \
            --output-spec "$RUN_ROOT/specs/formal-inputs.json" \
            --root .
          python scripts/build_formal_evidence.py \
            --spec "$RUN_ROOT/specs/formal-inputs.json" \
            --root . \
            --phase inputs
          test -s "$FORMAL_OUTPUT/formal-input-lock.json"
          python scripts/verify_public_evidence_safe.py \
            --root "$RUN_ROOT" \
            --root "$FORMAL_OUTPUT" \
            --allow-native-restore-archives

      - name: Upload public-development admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-public-dev-admission-${{ github.run_id }}
          path: |
            data/generated/public-dev-slot-003/
            data/scenarios/public-dev-slot-003/
            data/evidence/formal/aftermathbench-2026.08-r1/kubernetes/k8s-constraint-interaction-recovery/dev-006/

      - name: Purge native services
        if: always()
        run: |
          docker rm --force aftermath-interaction-registry || true
          python scripts/manage_kubernetes_stack.py down || true
          rm -rf -- \
            "$RUNNER_TEMP/kubernetes-public-dev-sensitive" \
            "$RUNNER_TEMP/kubernetes-public-dev-registry"
