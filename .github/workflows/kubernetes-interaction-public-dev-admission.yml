name: kubernetes-interaction-public-dev-admission

on:
  push:
    branches:
      - native-hard-recovery-v1
    paths:
      - ".github/workflows/kubernetes-interaction-public-dev-admission.yml"
      - "data/instance_specs/public-dev-slot-003.json"
      - "data/scenario_blueprints/public-dev-slot-003/**"
      - "scripts/build_kubernetes_interaction_admission.py"
      - "scripts/run_kubernetes_interaction_*.py"
      - "scripts/summarize_kubernetes_interaction_runtime.py"
      - "scripts/summarize_native_baselines.py"
      - "scripts/verify_kubernetes_interaction_instance_novelty.py"
      - "scripts/verify_kubernetes_interaction_public_dev_admission.py"
      - "src/aftermath_bench/native_admission.py"
      - "src/aftermath_bench/native_baseline_summary.py"
      - "src/aftermath_bench/native_kubernetes_interaction_family.py"
      - "src/aftermath_bench/integrations/kubernetes_interaction_*.py"
      - "tests/test_kubernetes_interaction*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-interaction-public-dev-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-and-admit-public-development-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: src
      AFTERMATH_KUBERNETES_INTERACTION_INSTANCE_SPEC: >-
        data/instance_specs/public-dev-slot-003.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Validate fresh instance and admission code
        run: |
          python scripts/verify_kubernetes_interaction_instance_novelty.py \
            --instance-spec "$AFTERMATH_KUBERNETES_INTERACTION_INSTANCE_SPEC" \
            --bound-blueprint \
              data/scenario_blueprints/public-dev-slot-003/scenario.json
          unset AFTERMATH_KUBERNETES_INTERACTION_INSTANCE_SPEC
          python -m unittest discover \
            -s tests -p 'test_kubernetes_interaction*.py' -v
          python -m unittest discover \
            -s tests -p 'test_evidence_projection_witness.py' -v

      - name: Build pinned kind from source
        run: |
          git clone --no-checkout \
            https://github.com/kubernetes-sigs/kind.git "$RUNNER_TEMP/kind"
          git -C "$RUNNER_TEMP/kind" fetch --depth 1 origin \
            9a205e8c8540557602240f8766d3c95c51c23c4c
          git -C "$RUNNER_TEMP/kind" checkout --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/kind" && \
            go build -trimpath -o "$RUNNER_TEMP/bin/kind" .)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install pinned kubectl
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/kubectl.sha256" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/bin/kubectl" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/kubectl"

      - name: Install checksum-pinned etcdutl
        run: |
          etcd_url="https://github.com/etcd-io/etcd/releases/download/v3.6.4/etcd-v3.6.4-linux-amd64.tar.gz"
          etcd_sha="4d5f3101daa534e45ccaf3eec8d21c19b7222db377bcfd5e5a9144155238c105"
          archive="$RUNNER_TEMP/etcd-v3.6.4-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" "$etcd_url"
          echo "$etcd_sha  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/etcd-v3.6.4-linux-amd64/etcdutl" \
            "$RUNNER_TEMP/bin/etcdutl"
          etcdutl version

      - name: Start native Kubernetes and durable external registry
        run: |
          python scripts/manage_kubernetes_stack.py up
          docker build --file runtimes/forgejo/control/Containerfile \
            --tag aftermathbench/kubernetes-control:local .
          kind load docker-image --name aftermath-kubernetes \
            aftermathbench/kubernetes-control:local
          registry_root="$RUNNER_TEMP/kubernetes-public-dev-registry"
          mkdir -p "$registry_root"
          docker run --detach \
            --name aftermath-interaction-registry \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1:9092:8080 \
            --mount "type=bind,src=$registry_root,dst=/data" \
            aftermathbench/kubernetes-control:local \
            python -m runtime_services.webhook_sink
          registry_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9092/health; then
              registry_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$registry_ready" != true ]]; then
            docker logs aftermath-interaction-registry
            exit 1
          fi

      - name: Install exact-replay mount before constructing boundaries
        run: python scripts/manage_kubernetes_stack.py prepare-snapshot-runtime

      - name: Replay thirteen exact native boundaries and references
        run: |
          run_root="$RUNNER_TEMP/kubernetes-public-dev-admission"
          sensitive_root="$RUNNER_TEMP/kubernetes-public-dev-sensitive"
          registry_database="$RUNNER_TEMP/kubernetes-public-dev-registry/webhook-sink.sqlite3"
          mkdir -p \
            "$run_root/runtime/state-evidence" \
            "$run_root/runtime/bundle-manifests" \
            "$run_root/baselines" \
            "$sensitive_root"
          variants=(
            state_01 state_02 state_03 state_04 state_05 state_06 state_07
            state_08 state_09 state_10 state_11 state_12 state_13
          )
          for variant in "${variants[@]}"; do
            python scripts/run_kubernetes_interaction_boundary.py \
              --variant "$variant" \
              --prefix-output "$run_root/runtime/prefix.json" \
              --output "$run_root/runtime/$variant-boundary.json"
            boundary="$run_root/runtime/state-evidence/$variant-boundary.json"
            reference_start="$run_root/runtime/state-evidence/$variant-reference-start.json"
            bundle="$sensitive_root/boundary-$variant"
            python scripts/capture_kubernetes_interaction_state_evidence.py \
              --variant "$variant" \
              --output "$boundary"
            python scripts/manage_kubernetes_stack.py snapshot-bundle \
              --snapshot "$bundle" \
              --registry-database "$registry_database"
            cp \
              "$bundle/bundle.json" \
              "$run_root/runtime/bundle-manifests/$variant.json"
            python scripts/manage_kubernetes_stack.py restore-bundle \
              --snapshot "$bundle" \
              --registry-database "$registry_database"
            python scripts/capture_kubernetes_interaction_state_evidence.py \
              --variant "$variant" \
              --expected "$boundary" \
              --wait-seconds 180 \
              --output "$reference_start"
            python scripts/run_kubernetes_interaction_control.py \
              --variant "$variant" \
              --output "$run_root/runtime/$variant-reference.json"
          done
          python scripts/summarize_kubernetes_interaction_runtime.py \
            --run-directory "$run_root/runtime" \
            --output "$run_root/runtime-summary.json" \
            --projection-output "$run_root/projection-witnesses.json"

      - name: Replay 117 fixed policies from exact native boundaries
        run: |
          run_root="$RUNNER_TEMP/kubernetes-public-dev-admission"
          sensitive_root="$RUNNER_TEMP/kubernetes-public-dev-sensitive"
          registry_database="$RUNNER_TEMP/kubernetes-public-dev-registry/webhook-sink.sqlite3"
          mkdir -p "$run_root/baselines/pre-state"
          variants=(
            state_01 state_02 state_03 state_04 state_05 state_06 state_07
            state_08 state_09 state_10 state_11 state_12 state_13
          )
          baselines=(
            no_op blind_retry always_abort always_compensate_abort
            always_defer_new_owner always_forward_new_owners
            always_publish_new_owner close_only compact_epoch_external_tree
          )
          for baseline in "${baselines[@]}"; do
            for variant in "${variants[@]}"; do
              bundle="$sensitive_root/boundary-$variant"
              boundary="$run_root/runtime/state-evidence/$variant-boundary.json"
              pre_state="$run_root/baselines/pre-state/$baseline-$variant.json"
              python scripts/manage_kubernetes_stack.py restore-bundle \
                --snapshot "$bundle" \
                --registry-database "$registry_database"
              python scripts/capture_kubernetes_interaction_state_evidence.py \
                --variant "$variant" \
                --expected "$boundary" \
                --wait-seconds 180 \
                --output "$pre_state"
              python scripts/run_kubernetes_interaction_baseline.py \
                --baseline "$baseline" \
                --variant "$variant" \
                --output "$run_root/baselines/$baseline-$variant.json"
            done
          done
          python scripts/summarize_native_baselines.py \
            --run-directory "$run_root/baselines" \
            --scenario \
              data/scenario_blueprints/public-dev-slot-003/scenario.json \
            --output "$run_root/baselines/summary.json"

      - name: Build and verify replay-derived hard admission
        run: |
          run_root="$RUNNER_TEMP/kubernetes-public-dev-admission"
          python scripts/build_kubernetes_interaction_admission.py \
            --run-directory "$run_root" \
            --blueprint \
              data/scenario_blueprints/public-dev-slot-003/scenario.json \
            --output-directory "$run_root/admitted-scenario"
          python -m aftermath_bench validate-native-scenario \
            --scenario "$run_root/admitted-scenario/scenario.json"
          python \
            scripts/verify_kubernetes_interaction_public_dev_admission.py \
            --run-directory "$run_root" \
            --output "$run_root/public-dev-admission-verification.json"

      - name: Upload public-development admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-public-dev-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/kubernetes-public-dev-admission/

      - name: Purge native services
        if: always()
        run: |
          docker rm --force aftermath-interaction-registry || true
          python scripts/manage_kubernetes_stack.py down || true
          rm -rf -- \
            "$RUNNER_TEMP/kubernetes-public-dev-sensitive" \
            "$RUNNER_TEMP/kubernetes-public-dev-registry"
