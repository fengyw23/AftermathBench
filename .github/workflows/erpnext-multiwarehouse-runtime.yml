name: erpnext-multiwarehouse-runtime

on:
  push:
    branches:
      - erpnext-multiwarehouse-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONPATH: src
      AFTERMATH_DB_ROOT_PASSWORD: aftermath-root
      AFTERMATH_ADMIN_PASSWORD: aftermath-admin
      RUN_ROOT: runtimes/erpnext/.runtime/multiwarehouse
      BLUEPRINT: data/scenario_blueprints/erpnext-multiwarehouse-transfer-dev-001/scenario.json
      GENERATED_SCENARIO: data/scenarios/erpnext-multiwarehouse-transfer-dev-001
      CONTROL_ROOT: runtimes/erpnext/.runtime/multiwarehouse/control
      FORMAL_OUTPUT: data/evidence/formal/aftermathbench-2026.08-r1/erpnext/erpnext-multiwarehouse-transfer/dev-001
      BENCHMARK_RELEASE_ID: aftermathbench-2026.08-r1
      AFTERMATH_MODEL_BASE_URL: https://ws-ogjwl5f71op9q2jf.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate multiwarehouse code and runtime metadata
        run: |
          python -m unittest discover -s tests -p 'test_erpnext_multiwarehouse*.py' -v
          python -m unittest discover -s tests -p 'test_native_erpnext_multiwarehouse_family.py' -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned ERPNext and Frappe from source
        run: |
          mkdir -p "$RUN_ROOT/logs" "$RUN_ROOT/runtime" "$RUN_ROOT/bundles"
          python scripts/build_erpnext_runtime.py \
            --source-directory "$RUNNER_TEMP/frappe_docker" \
            --execute \
            --report "$RUN_ROOT/source-verification.json"

      - name: Build native multiwarehouse prefix
        run: |
          runtime_root="runtimes/erpnext/.runtime"
          python scripts/manage_erpnext_stack.py up
          python scripts/manage_erpnext_stack.py setup
          if ! python scripts/build_erpnext_multiwarehouse_prefix.py \
            --scenario "$BLUEPRINT" \
            --credentials "$runtime_root/credentials.json" \
            --output "$RUN_ROOT/runtime/prefix.json" \
            > "$RUN_ROOT/logs/prefix.log" 2>&1
          then
            cat "$RUN_ROOT/logs/prefix.log"
            annotation="$({ tail -n 45 "$RUN_ROOT/logs/prefix.log" || true; } \
              | sed 's/%/%25/g; s/\r/%0D/g' \
              | awk 'BEGIN { ORS="%0A" } { print }')"
            echo "::error title=Native multiwarehouse prefix failed::$annotation"
            docker compose \
              --project-name aftermath-erpnext \
              --file runtimes/erpnext/compose.yaml \
              logs --no-color --tail 300 backend queue-short queue-long
            exit 1
          fi
          python scripts/manage_erpnext_stack.py snapshot-bundle \
            --snapshot "$RUN_ROOT/bundles/prefix"
          mkdir -p "$RUN_ROOT/runtime/state-evidence" "$RUN_ROOT/specs" \
            "$CONTROL_ROOT/model-runs/repetition-01" \
            "$CONTROL_ROOT/pre-model-boundaries"

      - name: Replay four ambiguous boundaries and references
        run: |
          runtime_root="runtimes/erpnext/.runtime"
          run_checked() {
            title="$1"
            log="$2"
            shift 2
            if ! "$@" > "$log" 2>&1
            then
              cat "$log"
              annotation="$({ tail -n 50 "$log" || true; } \
                | sed 's/%/%25/g; s/\r/%0D/g' \
                | awk 'BEGIN { ORS="%0A" } { print }')"
              echo "::error title=$title::$annotation"
              return 1
            fi
            cat "$log"
          }
          variants=(
            request_not_reached
            database_committed_response_lost
            after_commit_enqueue_failed
            async_job_pending
          )
          for variant in "${variants[@]}"
          do
            echo "::group::$variant"
            python scripts/manage_erpnext_stack.py restore-bundle \
              --snapshot "$RUN_ROOT/bundles/prefix"
            run_checked "Multiwarehouse reset capture failed: $variant" \
              "$RUN_ROOT/logs/$variant-reset.log" \
              python scripts/capture_erpnext_multiwarehouse_state_evidence.py \
              --phase reset \
              --scenario "$GENERATED_SCENARIO/scenario.json" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --variant "$variant" \
              --bundle-manifest "$RUN_ROOT/bundles/prefix/bundle.json" \
              --output "$RUN_ROOT/runtime/state-evidence/$variant-reset.json"
            run_checked "Multiwarehouse boundary failed: $variant" \
              "$RUN_ROOT/logs/$variant-boundary.log" \
              python scripts/run_erpnext_multiwarehouse_failure.py \
              --variant "$variant" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --snapshot-bundle "$RUN_ROOT/bundles/prefix" \
              --formal-contract \
              --output "$RUN_ROOT/runtime/$variant.json"
            cp "$RUN_ROOT/runtime/$variant.json" \
              "$RUN_ROOT/runtime/$variant-boundary.json"
            python scripts/manage_erpnext_stack.py snapshot-bundle \
              --snapshot "$RUN_ROOT/bundles/boundary-$variant"
            run_checked "Multiwarehouse boundary capture failed: $variant" \
              "$RUN_ROOT/logs/$variant-boundary-capture.log" \
              python scripts/capture_erpnext_multiwarehouse_state_evidence.py \
              --phase boundary \
              --scenario "$GENERATED_SCENARIO/scenario.json" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --variant "$variant" \
              --bundle-manifest "$RUN_ROOT/bundles/boundary-$variant/bundle.json" \
              --reset-evidence "$RUN_ROOT/runtime/state-evidence/$variant-reset.json" \
              --failure-report "$RUN_ROOT/runtime/$variant-boundary.json" \
              --output "$RUN_ROOT/runtime/state-evidence/$variant-boundary.json"
            python scripts/manage_erpnext_stack.py restore-bundle \
              --snapshot "$RUN_ROOT/bundles/boundary-$variant"
            run_checked "Multiwarehouse reference-start capture failed: $variant" \
              "$RUN_ROOT/logs/$variant-reference-start.log" \
              python scripts/capture_erpnext_multiwarehouse_state_evidence.py \
              --phase boundary \
              --scenario "$GENERATED_SCENARIO/scenario.json" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --variant "$variant" \
              --bundle-manifest "$RUN_ROOT/bundles/boundary-$variant/bundle.json" \
              --reset-evidence "$RUN_ROOT/runtime/state-evidence/$variant-reset.json" \
              --failure-report "$RUN_ROOT/runtime/$variant-boundary.json" \
              --output "$RUN_ROOT/runtime/state-evidence/$variant-reference-start.json"
            run_checked "Multiwarehouse reference failed: $variant" \
              "$RUN_ROOT/logs/$variant-reference.log" \
              python scripts/run_erpnext_multiwarehouse_control.py \
              --variant "$variant" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --formal-contract \
              --output "$RUN_ROOT/runtime/$variant-reference.json"
            baselines=(
              no_op
              blind_retry
              assume_committed
              repair_failed_record_only
              all_rollback
              duplicate_second_leg
              cancel_protected_reservation
            )
            for baseline in "${baselines[@]}"
            do
              python scripts/manage_erpnext_stack.py restore-bundle \
                --snapshot "$RUN_ROOT/bundles/boundary-$variant"
              run_checked "Multiwarehouse baseline failed: $variant/$baseline" \
                "$RUN_ROOT/logs/$variant-baseline-$baseline.log" \
                python scripts/run_erpnext_multiwarehouse_baseline.py \
                --baseline "$baseline" \
                --variant "$variant" \
                --credentials "$runtime_root/credentials.json" \
                --prefix "$RUN_ROOT/runtime/prefix.json" \
                --output "$RUN_ROOT/runtime/$variant-baseline-$baseline.json"
            done
            echo "::endgroup::"
          done

      - name: Derive strict native hard admission
        run: |
          if ! python scripts/build_erpnext_multiwarehouse_admission.py \
            --runtime-directory "$RUN_ROOT/runtime" \
            --blueprint "$BLUEPRINT" \
            --output-directory "$GENERATED_SCENARIO" \
            > "$RUN_ROOT/logs/admission.log" 2>&1
          then
            cat "$RUN_ROOT/logs/admission.log"
            annotation="$({ tail -n 60 "$RUN_ROOT/logs/admission.log" || true; } \
              | sed 's/%/%25/g; s/\r/%0D/g' \
              | awk 'BEGIN { ORS="%0A" } { print }')"
            echo "::error title=Multiwarehouse hard admission failed::$annotation"
            exit 1
          fi
          cat "$RUN_ROOT/logs/admission.log"

      - name: Freeze the five formal input roles from this native replay
        run: |
          cp "$RUN_ROOT/source-verification.json" \
            "$RUN_ROOT/runtime/source-verification.json"
          cp -R "$GENERATED_SCENARIO" "$RUN_ROOT/scenario"
          python scripts/build_evidence_file_manifest.py \
            --root "$RUN_ROOT" \
            --output "$RUN_ROOT/files.json"
          capture_args=(
            --capture-bundle-manifest "$RUN_ROOT/bundles/prefix/bundle.json"
          )
          for variant in request_not_reached database_committed_response_lost after_commit_enqueue_failed async_job_pending
          do
            capture_args+=(
              --capture-bundle-manifest "$RUN_ROOT/bundles/boundary-$variant/bundle.json"
            )
          done
          python scripts/generate_erpnext_multiwarehouse_formal_build_spec.py \
            --phase inputs \
            --benchmark-release-id "$BENCHMARK_RELEASE_ID" \
            --scenario "$GENERATED_SCENARIO/scenario.json" \
            --runtime-manifest "$RUN_ROOT/files.json" \
            --capture-directory "$RUN_ROOT/runtime/state-evidence" \
            "${capture_args[@]}" \
            --formal-output-directory "$FORMAL_OUTPUT" \
            --output-spec "$RUN_ROOT/specs/formal-inputs.json" \
            --root .
          python scripts/build_formal_evidence.py \
            --spec "$RUN_ROOT/specs/formal-inputs.json" \
            --root . \
            --phase inputs
          test -s "$FORMAL_OUTPUT/formal-input-lock.json"

      - name: Run execution controls from the locked native boundaries
        env:
          AFTERMATH_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          MODEL_ID: glm-5.2
        run: |
          test -n "$AFTERMATH_API_KEY"
          runtime_root="runtimes/erpnext/.runtime"
          variants=(
            request_not_reached
            database_committed_response_lost
            after_commit_enqueue_failed
            async_job_pending
          )
          run_status=0
          for variant in "${variants[@]}"
          do
            pre_model="$CONTROL_ROOT/pre-model-boundaries/$variant-boundary.json"
            output="$CONTROL_ROOT/model-runs/repetition-01/$variant.json"
            python scripts/manage_erpnext_stack.py restore-bundle \
              --snapshot "$RUN_ROOT/bundles/boundary-$variant"
            python scripts/capture_erpnext_multiwarehouse_state_evidence.py \
              --phase boundary \
              --scenario "$GENERATED_SCENARIO/scenario.json" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --variant "$variant" \
              --bundle-manifest "$RUN_ROOT/bundles/boundary-$variant/bundle.json" \
              --reset-evidence "$RUN_ROOT/runtime/state-evidence/$variant-reset.json" \
              --failure-report "$RUN_ROOT/runtime/$variant-boundary.json" \
              --output "$pre_model"
            cmp "$RUN_ROOT/runtime/state-evidence/$variant-boundary.json" "$pre_model"
            python -m aftermath_bench run-native-model \
              --provider openai-compatible \
              --base-url "$AFTERMATH_MODEL_BASE_URL" \
              --model "$MODEL_ID" \
              --scenario "$GENERATED_SCENARIO/scenario.json" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --failure-report "$RUN_ROOT/runtime/$variant-boundary.json" \
              --max-turns 25 \
              --execution-control \
              --formal-input-lock "$FORMAL_OUTPUT/formal-input-lock.json" \
              --pre-model-boundary-evidence "$pre_model" \
              --output "$output" \
              > "$RUN_ROOT/logs/control-$variant.log" 2>&1 \
              || run_status=1
          done
          python scripts/summarize_native_model_runs.py \
            --run-directory "$CONTROL_ROOT/model-runs" \
            --scenario "$GENERATED_SCENARIO/scenario.json" \
            --expected-execution-control true \
            --output "$CONTROL_ROOT/model-runs/summary.json" \
            > "$RUN_ROOT/logs/control-summary.log" 2>&1 \
            || run_status=1
          python scripts/validate_native_control_summary.py \
            --summary "$CONTROL_ROOT/model-runs/summary.json" \
            --expected-cases 4 \
            --minimum-pass-rate 0.8 \
            > "$RUN_ROOT/logs/control-gate.log" 2>&1 \
            || run_status=1
          test "$run_status" -eq 0

      - name: Complete the seven-role formal evidence package
        run: |
          python scripts/build_evidence_file_manifest.py \
            --root "$CONTROL_ROOT" \
            --output "$CONTROL_ROOT/files.json"
          capture_args=(
            --capture-bundle-manifest "$RUN_ROOT/bundles/prefix/bundle.json"
          )
          for variant in request_not_reached database_committed_response_lost after_commit_enqueue_failed async_job_pending
          do
            capture_args+=(
              --capture-bundle-manifest "$RUN_ROOT/bundles/boundary-$variant/bundle.json"
            )
          done
          python scripts/generate_erpnext_multiwarehouse_formal_build_spec.py \
            --phase complete \
            --benchmark-release-id "$BENCHMARK_RELEASE_ID" \
            --scenario "$GENERATED_SCENARIO/scenario.json" \
            --runtime-manifest "$RUN_ROOT/files.json" \
            --capture-directory "$RUN_ROOT/runtime/state-evidence" \
            "${capture_args[@]}" \
            --control-manifest "$CONTROL_ROOT/files.json" \
            --model-input-lock "$FORMAL_OUTPUT/formal-input-lock.json" \
            --formal-output-directory "$FORMAL_OUTPUT" \
            --output-spec "$RUN_ROOT/specs/formal-complete.json" \
            --root .
          python scripts/build_formal_evidence.py \
            --spec "$RUN_ROOT/specs/formal-complete.json" \
            --root . \
            --phase complete
          test -s "$FORMAL_OUTPUT/completion/declarations.json"

      - name: Publish admitted scenario to evidence branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force "$GENERATED_SCENARIO" "$FORMAL_OUTPUT"
          git commit -m "data(erpnext): generate multiwarehouse evidence"
          git push --force origin \
            HEAD:refs/heads/generated/erpnext-multiwarehouse-transfer-dev-001

      - name: Capture diagnostics
        if: always()
        run: |
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            ps --all > "$RUN_ROOT/compose-ps.txt" 2>&1 || true
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            logs --no-color --tail 500 > "$RUN_ROOT/compose.log" 2>&1 || true
          rm -f runtimes/erpnext/.runtime/credentials.json

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-multiwarehouse-${{ github.run_id }}
          path: |
            runtimes/erpnext/.runtime/multiwarehouse/
            data/scenarios/erpnext-multiwarehouse-transfer-dev-001/
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        run: python scripts/manage_erpnext_stack.py purge || true
