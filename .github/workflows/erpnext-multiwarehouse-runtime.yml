name: erpnext-multiwarehouse-runtime

on:
  push:
    branches:
      - erpnext-multiwarehouse-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONPATH: src
      AFTERMATH_DB_ROOT_PASSWORD: aftermath-root
      AFTERMATH_ADMIN_PASSWORD: aftermath-admin
      RUN_ROOT: runtimes/erpnext/.runtime/multiwarehouse
      BLUEPRINT: data/scenario_blueprints/erpnext-multiwarehouse-transfer-dev-001/scenario.json
      GENERATED_SCENARIO: data/scenarios/erpnext-multiwarehouse-transfer-dev-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate multiwarehouse code and runtime metadata
        run: |
          python -m unittest discover -s tests -p 'test_erpnext_multiwarehouse*.py' -v
          python -m unittest discover -s tests -p 'test_native_erpnext_multiwarehouse_family.py' -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned ERPNext and Frappe from source
        run: |
          mkdir -p "$RUN_ROOT/logs" "$RUN_ROOT/runtime" "$RUN_ROOT/bundles"
          python scripts/build_erpnext_runtime.py \
            --source-directory "$RUNNER_TEMP/frappe_docker" \
            --execute \
            --report "$RUN_ROOT/source-verification.json"

      - name: Build native multiwarehouse prefix
        run: |
          runtime_root="runtimes/erpnext/.runtime"
          python scripts/manage_erpnext_stack.py up
          python scripts/manage_erpnext_stack.py setup
          if ! python scripts/build_erpnext_multiwarehouse_prefix.py \
            --scenario "$BLUEPRINT" \
            --credentials "$runtime_root/credentials.json" \
            --output "$RUN_ROOT/runtime/prefix.json" \
            > "$RUN_ROOT/logs/prefix.log" 2>&1
          then
            cat "$RUN_ROOT/logs/prefix.log"
            annotation="$({ tail -n 45 "$RUN_ROOT/logs/prefix.log" || true; } \
              | sed 's/%/%25/g; s/\r/%0D/g' \
              | awk 'BEGIN { ORS="%0A" } { print }')"
            echo "::error title=Native multiwarehouse prefix failed::$annotation"
            docker compose \
              --project-name aftermath-erpnext \
              --file runtimes/erpnext/compose.yaml \
              logs --no-color --tail 300 backend queue-short queue-long
            exit 1
          fi
          python scripts/manage_erpnext_stack.py snapshot-bundle \
            --snapshot "$RUN_ROOT/bundles/prefix"

      - name: Replay four ambiguous boundaries and references
        run: |
          runtime_root="runtimes/erpnext/.runtime"
          run_checked() {
            title="$1"
            log="$2"
            shift 2
            if ! "$@" > "$log" 2>&1
            then
              cat "$log"
              annotation="$({ tail -n 50 "$log" || true; } \
                | sed 's/%/%25/g; s/\r/%0D/g' \
                | awk 'BEGIN { ORS="%0A" } { print }')"
              echo "::error title=$title::$annotation"
              return 1
            fi
            cat "$log"
          }
          variants=(
            request_not_reached
            database_committed_response_lost
            after_commit_enqueue_failed
            async_job_pending
          )
          for variant in "${variants[@]}"
          do
            echo "::group::$variant"
            run_checked "Multiwarehouse boundary failed: $variant" \
              "$RUN_ROOT/logs/$variant-boundary.log" \
              python scripts/run_erpnext_multiwarehouse_failure.py \
              --variant "$variant" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --snapshot-bundle "$RUN_ROOT/bundles/prefix" \
              --output "$RUN_ROOT/runtime/$variant.json"
            python scripts/manage_erpnext_stack.py snapshot-bundle \
              --snapshot "$RUN_ROOT/bundles/boundary-$variant"
            python scripts/manage_erpnext_stack.py restore-bundle \
              --snapshot "$RUN_ROOT/bundles/boundary-$variant"
            run_checked "Multiwarehouse reference failed: $variant" \
              "$RUN_ROOT/logs/$variant-reference.log" \
              python scripts/run_erpnext_multiwarehouse_control.py \
              --variant "$variant" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --output "$RUN_ROOT/runtime/$variant-reference.json"
            baselines=(
              no_op
              blind_retry
              assume_committed
              repair_failed_record_only
              all_rollback
              duplicate_second_leg
              cancel_protected_reservation
            )
            for baseline in "${baselines[@]}"
            do
              python scripts/manage_erpnext_stack.py restore-bundle \
                --snapshot "$RUN_ROOT/bundles/boundary-$variant"
              run_checked "Multiwarehouse baseline failed: $variant/$baseline" \
                "$RUN_ROOT/logs/$variant-baseline-$baseline.log" \
                python scripts/run_erpnext_multiwarehouse_baseline.py \
                --baseline "$baseline" \
                --variant "$variant" \
                --credentials "$runtime_root/credentials.json" \
                --prefix "$RUN_ROOT/runtime/prefix.json" \
                --output "$RUN_ROOT/runtime/$variant-baseline-$baseline.json"
            done
            echo "::endgroup::"
          done

      - name: Derive strict native hard admission
        run: |
          if ! python scripts/build_erpnext_multiwarehouse_admission.py \
            --runtime-directory "$RUN_ROOT/runtime" \
            --blueprint "$BLUEPRINT" \
            --output-directory "$GENERATED_SCENARIO" \
            > "$RUN_ROOT/logs/admission.log" 2>&1
          then
            cat "$RUN_ROOT/logs/admission.log"
            annotation="$({ tail -n 60 "$RUN_ROOT/logs/admission.log" || true; } \
              | sed 's/%/%25/g; s/\r/%0D/g' \
              | awk 'BEGIN { ORS="%0A" } { print }')"
            echo "::error title=Multiwarehouse hard admission failed::$annotation"
            exit 1
          fi
          cat "$RUN_ROOT/logs/admission.log"

      - name: Publish admitted scenario to evidence branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force "$GENERATED_SCENARIO"
          git commit -m "data(erpnext): generate multiwarehouse evidence"
          git push --force origin \
            HEAD:refs/heads/generated/erpnext-multiwarehouse-transfer-dev-001

      - name: Capture diagnostics
        if: always()
        run: |
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            ps --all > "$RUN_ROOT/compose-ps.txt" 2>&1 || true
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            logs --no-color --tail 500 > "$RUN_ROOT/compose.log" 2>&1 || true
          rm -f runtimes/erpnext/.runtime/credentials.json

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-multiwarehouse-${{ github.run_id }}
          path: |
            runtimes/erpnext/.runtime/multiwarehouse/
            data/scenarios/erpnext-multiwarehouse-transfer-dev-001/
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        run: python scripts/manage_erpnext_stack.py purge || true
