name: forgejo-publication-candidate

on:
  push:
    branches:
      - forgejo-publication-candidate
      - forgejo-publication-hidden-test-002
  workflow_dispatch:
    inputs:
      model:
        description: Execution-control model identifier
        required: true
        default: glm-5.2
        type: string
      run_execution_control:
        description: Consume the frozen candidate with an execution control
        required: true
        default: true
        type: boolean
      instance_id:
        description: Fresh hidden instance slot to freeze or evaluate
        required: true
        default: test-001
        type: string

permissions:
  contents: write

jobs:
  freeze-then-control:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: src
      AFTERMATH_MODEL_BASE_URL: https://ws-ogjwl5f71op9q2jf.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      SELECTED_INSTANCE_ID: ${{ inputs.instance_id || (github.ref_name == 'forgejo-publication-hidden-test-002' && 'test-002' || 'test-001') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize private candidate without model credentials
        env:
          HIDDEN_INSTANCE_B64: ${{ secrets.FORGEJO_PUBLICATION_HIDDEN_INSTANCE_B64 }}
        run: |
          run_root="$RUNNER_TEMP/forgejo-candidate"
          mkdir -p "$run_root/public"
          write_bootstrap_status() {
            printf '{"schema_version":"1.0","phase":"%s"}\n' "$1" \
              > "$run_root/public/bootstrap-status.json"
            printf '::notice::bootstrap_phase=%s\n' "$1"
          }
          mkdir -p "$run_root/private/runtime" \
            "$run_root/private/baselines" \
            "$run_root/private/logs" \
            "$run_root/private/snapshots" \
            "$run_root/public"
          if [ -n "$HIDDEN_INSTANCE_B64" ]
          then
            printf '%s' "$HIDDEN_INSTANCE_B64" \
              | base64 --decode > "$run_root/private/instance.json"
            write_bootstrap_status "secret_decoded"
          else
            python scripts/generate_forgejo_publication_hidden_instance.py \
              --instance-id "$SELECTED_INSTANCE_ID" \
              --output "$run_root/private/instance.json" \
              > "$run_root/private/logs/instance-generation.log" 2>&1
            write_bootstrap_status "instance_generated"
          fi
          python scripts/verify_forgejo_instance_novelty.py \
            --instance-spec "$run_root/private/instance.json"
          write_bootstrap_status "novelty_verified"
          python scripts/render_forgejo_publication_blueprint.py \
            --instance-spec "$run_root/private/instance.json" \
            --output "$run_root/private/blueprint.json" \
            --instance-id "$SELECTED_INSTANCE_ID" \
            --benchmark-split hidden_test
          write_bootstrap_status "blueprint_rendered"
          python -m unittest discover -s tests -v
          write_bootstrap_status "tests_passed"

      - name: Build pinned Forgejo from source
        run: |
          run_root="$RUNNER_TEMP/forgejo-candidate"
          python scripts/build_forgejo_runtime.py \
            --source-directory "$RUNNER_TEMP/forgejo" \
            --checkout \
            --build \
            --report "$run_root/private/source-verification.json"

      - name: Build the independent native prefix
        run: |
          run_root="$RUNNER_TEMP/forgejo-candidate"
          runtime_root="runtimes/forgejo/.runtime"
          mkdir -p "$runtime_root" "$run_root/private/logs"
          owner="$(
            python -c 'import json,sys; print(json.load(open(sys.argv[1]))["owner"])' \
              "$run_root/private/instance.json"
          )"
          python scripts/manage_forgejo_stack.py up
          python scripts/manage_forgejo_stack.py setup \
            --username "$owner" \
            --email "$owner@aftermath.invalid"
          python scripts/build_forgejo_publication_prefix.py \
            --credentials "$runtime_root/credentials.json" \
            --instance-spec "$run_root/private/instance.json" \
            --output "$run_root/private/runtime/prefix.json" \
            > "$run_root/private/logs/prefix.log" 2>&1
          python scripts/manage_forgejo_stack.py snapshot \
            --snapshot "$run_root/private/prefix.tar.gz"

      - name: Freeze exact matched boundaries and run references
        run: |
          run_root="$RUNNER_TEMP/forgejo-candidate"
          runtime_root="runtimes/forgejo/.runtime"
          run_private() {
            label="$1"
            log_path="$2"
            shift 2
            if "$@" > "$log_path" 2>&1
            then
              return 0
            fi
            python - "$label" "$log_path" <<'PY'
          import re
          import sys
          from pathlib import Path

          label, path = sys.argv[1:]
          text = Path(path).read_text(encoding="utf-8", errors="replace")
          exception_types = sorted(set(re.findall(
              r"\b([A-Z][A-Za-z]+(?:Error|Exception))\b", text
          )))
          check_names = []
          for match in re.findall(r'"failures"\s*:\s*\[(.*?)\]', text, re.S):
              check_names.extend(re.findall(r'"([a-z_]+)"', match))
          check_names = sorted(set(check_names))
          print(
              "::error title=Forgejo hidden replay failed::"
              f"label={label};"
              f"exception_types={','.join(exception_types[-4:]) or 'none'};"
              f"check_names={','.join(check_names[-4:]) or 'none'}"
          )
          PY
            return 1
          }
          mapfile -t variants < <(
            python -c 'import json,sys; print(*[x["id"] for x in json.load(open(sys.argv[1]))["matched_variants"]], sep="\n")' \
              "$run_root/private/blueprint.json"
          )
          for variant in "${variants[@]}"
          do
            python scripts/manage_forgejo_stack.py restore \
              --snapshot "$run_root/private/prefix.tar.gz"
            run_private "boundary:$variant" \
              "$run_root/private/logs/$variant-boundary.log" \
              python scripts/run_forgejo_publication_boundary.py \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$run_root/private/runtime/prefix.json" \
              --variant "$variant" \
              --output "$run_root/private/runtime/$variant-boundary.json"
            python scripts/manage_forgejo_stack.py snapshot-bundle \
              --snapshot "$run_root/private/snapshots/$variant"
            python scripts/manage_forgejo_stack.py restore-bundle \
              --snapshot "$run_root/private/snapshots/$variant"
            run_private "reference:$variant" \
              "$run_root/private/logs/$variant-reference.log" \
              python scripts/run_forgejo_publication_control.py \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$run_root/private/runtime/prefix.json" \
              --variant "$variant" \
              --output "$run_root/private/runtime/$variant-reference.json"
          done

      - name: Execute fixed policies from the same state bundles
        run: |
          run_root="$RUNNER_TEMP/forgejo-candidate"
          runtime_root="runtimes/forgejo/.runtime"
          mapfile -t variants < <(
            python -c 'import json,sys; print(*[x["id"] for x in json.load(open(sys.argv[1]))["matched_variants"]], sep="\n")' \
              "$run_root/private/blueprint.json"
          )
          baselines=(
            no_op
            blind_publish
            assume_release_exists
            repair_assets_only
            replay_all_failed
            compact_release_tree
          )
          for baseline in "${baselines[@]}"
          do
            for variant in "${variants[@]}"
            do
              python scripts/manage_forgejo_stack.py restore-bundle \
                --snapshot "$run_root/private/snapshots/$variant"
              python scripts/run_forgejo_publication_baseline.py \
                --credentials "$runtime_root/credentials.json" \
                --prefix "$run_root/private/runtime/prefix.json" \
                --baseline "$baseline" \
                --variant "$variant" \
                --output "$run_root/private/baselines/$baseline-$variant.json" \
                > "$run_root/private/logs/$baseline-$variant.log" 2>&1
            done
          done

      - name: Admit and freeze before any provider request
        run: |
          run_root="$RUNNER_TEMP/forgejo-candidate"
          python scripts/build_forgejo_publication_admission.py \
            --runtime-directory "$run_root/private/runtime" \
            --baseline-directory "$run_root/private/baselines" \
            --blueprint "$run_root/private/blueprint.json" \
            --output-directory "$run_root/private/scenario" \
            > "$run_root/private/logs/admission.log" 2>&1
          python -m aftermath_bench validate-native-scenario \
            --scenario "$run_root/private/scenario/scenario.json" \
            > "$run_root/private/logs/scenario-validation.log" 2>&1
          runtime_revision="$(
            python -c 'import json; print(json.load(open("runtimes/forgejo/runtime.lock.json"))["source"]["revision"])'
          )"
          python scripts/freeze_native_bundle.py \
            --bundle-root "$run_root/private" \
            --scenario "$run_root/private/scenario/scenario.json" \
            --instance-spec "$run_root/private/instance.json" \
            --source-commit "$GITHUB_SHA" \
            --runtime-revision "$runtime_revision" \
            --private-attestation "$run_root/private/freeze.json" \
            --public-commitment "$run_root/private/public-commitment.json" \
            --usage-ledger "$run_root/private/usage-ledger.json"
          python scripts/verify_hidden_test_eligibility.py \
            --scenario "$run_root/private/scenario/scenario.json" \
            --freeze "$run_root/private/freeze.json" \
            --usage-ledger "$run_root/private/usage-ledger.json" \
            > "$RUNNER_TEMP/forgejo-hidden-eligibility.log" 2>&1
          cp "$run_root/private/public-commitment.json" \
            "$run_root/public/pre-model-commitment.json"

      - name: Lock and run execution control on frozen state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_execution_control }}
        env:
          AFTERMATH_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          MODEL_ID: ${{ inputs.model || 'glm-5.2' }}
        run: |
          test -n "$AFTERMATH_API_KEY"
          run_root="$RUNNER_TEMP/forgejo-candidate"
          runtime_root="runtimes/forgejo/.runtime"
          python scripts/verify_frozen_bundle.py \
            --bundle-root "$run_root/private" \
            --private-attestation "$run_root/private/freeze.json" \
            --public-commitment "$run_root/private/public-commitment.json" \
            --allow-unbound usage-ledger.json \
            > "$RUNNER_TEMP/forgejo-pre-provider-freeze-check.log" 2>&1
          mapfile -t variants < <(
            python -c 'import json,sys; print(*[x["id"] for x in json.load(open(sys.argv[1]))["matched_variants"]], sep="\n")' \
              "$run_root/private/blueprint.json"
          )
          mkdir -p "$run_root/private/control/repetition-01"
          run_status=0
          evaluation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-execution-control"
          last_index=$((${#variants[@]} - 1))
          for index in "${!variants[@]}"
          do
            variant="${variants[$index]}"
            finalize_args=()
            if [ "$index" -eq "$last_index" ]
            then
              finalize_args=(--hidden-finalize)
            fi
            python scripts/manage_forgejo_stack.py restore-bundle \
              --snapshot "$run_root/private/snapshots/$variant"
            if python -m aftermath_bench run-native-model \
                --provider openai-compatible \
                --base-url "$AFTERMATH_MODEL_BASE_URL" \
                --model "$MODEL_ID" \
                --scenario "$run_root/private/scenario/scenario.json" \
                --credentials "$runtime_root/credentials.json" \
                --prefix "$run_root/private/runtime/prefix.json" \
                --failure-report "$run_root/private/runtime/$variant-boundary.json" \
                --max-turns 25 \
                --execution-control \
                --hidden-freeze "$run_root/private/freeze.json" \
                --hidden-usage-ledger "$run_root/private/usage-ledger.json" \
                --hidden-evaluation-id "$evaluation_id" \
                "${finalize_args[@]}" \
                --output "$run_root/private/control/repetition-01/$variant.json" \
                > "$run_root/private/control/repetition-01/$variant.log" 2>&1
            then
              true
            elif [ ! -s "$run_root/private/control/repetition-01/$variant.json" ]
            then
              run_status=1
            fi
          done
          python scripts/summarize_native_model_runs.py \
            --run-directory "$run_root/private/control" \
            --scenario "$run_root/private/scenario/scenario.json" \
            --output "$run_root/private/control/summary.json" \
            --expected-execution-control true \
            > "$run_root/private/control/summary.log" 2>&1 \
            || run_status=1
          expected_cases="${#variants[@]}"
          python scripts/validate_native_control_summary.py \
            --summary "$run_root/private/control/summary.json" \
            --expected-cases "$expected_cases" \
            --minimum-pass-rate 0.8 \
            > "$run_root/private/control/gate.log" 2>&1 \
            || run_status=1
          exit "$run_status"

      - name: Build non-sensitive result
        if: always()
        run: |
          run_root="$RUNNER_TEMP/forgejo-candidate"
          control_args=()
          if [ -f "$run_root/private/control/summary.json" ]
          then
            control_args=(
              --control-summary "$run_root/private/control/summary.json"
            )
          fi
          python scripts/summarize_frozen_candidate.py \
            --commitment "$run_root/private/public-commitment.json" \
            --admission "$run_root/private/scenario/artifacts/admission.json" \
            --reference "$run_root/private/scenario/artifacts/reference.json" \
            --baselines "$run_root/private/scenario/artifacts/baselines.json" \
            --usage-ledger "$run_root/private/usage-ledger.json" \
            "${control_args[@]}" \
            --output "$run_root/public/result.json"

      - name: Seal an unseen private bundle for later evaluation
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.run_execution_control) }}
        env:
          HIDDEN_BUNDLE_ENCRYPTION_KEY: ${{ secrets.HIDDEN_BUNDLE_ENCRYPTION_KEY }}
        run: |
          test -n "$HIDDEN_BUNDLE_ENCRYPTION_KEY"
          run_root="$RUNNER_TEMP/forgejo-candidate"
          python scripts/verify_hidden_test_eligibility.py \
            --scenario "$run_root/private/scenario/scenario.json" \
            --freeze "$run_root/private/freeze.json" \
            --usage-ledger "$run_root/private/usage-ledger.json" \
            > "$RUNNER_TEMP/forgejo-pre-seal-eligibility.log" 2>&1
          archive="$RUNNER_TEMP/forgejo-hidden-private.tar.gz"
          ciphertext="$run_root/public/hidden-bundle.tar.gz.enc"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            -C "$run_root" private
          openssl enc \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -salt \
            -pass env:HIDDEN_BUNDLE_ENCRYPTION_KEY \
            -in "$archive" \
            -out "$ciphertext"
          rm -f "$archive"
          python - \
            "$run_root/private/public-commitment.json" \
            "$ciphertext" \
            "$run_root/public/sealed-bundle.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          commitment_path = Path(sys.argv[1])
          ciphertext_path = Path(sys.argv[2])
          output_path = Path(sys.argv[3])
          commitment = json.loads(
              commitment_path.read_text(encoding="utf-8")
          )
          payload = {
              "schema_version": "1.0",
              "lifecycle_status": "frozen_unseen",
              "source_commit": os.environ["GITHUB_SHA"],
              "source_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "public_commitment_sha256": commitment[
                  "public_commitment_sha256"
              ],
              "cipher": "aes-256-cbc-pbkdf2-sha256",
              "pbkdf2_iterations": 200000,
              "ciphertext_file": ciphertext_path.name,
              "ciphertext_sha256": hashlib.sha256(
                  ciphertext_path.read_bytes()
              ).hexdigest(),
          }
          output_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          test -s "$ciphertext"
          test -s "$run_root/public/sealed-bundle.json"

      - name: Register a safe frozen-hidden receipt
        if: ${{ github.event_name == 'push' }}
        run: |
          run_root="$RUNNER_TEMP/forgejo-candidate"
          instance_id="$SELECTED_INSTANCE_ID"
          receipt="data/evidence/hidden-freeze/forgejo-publication-$instance_id.json"
          test ! -e "$receipt"
          python - \
            "$run_root/public/pre-model-commitment.json" \
            "$run_root/public/sealed-bundle.json" \
            "$run_root/public/result.json" \
            "$receipt" \
            "data/frozen_hidden_candidates.json" \
            "$instance_id" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          commitment_path, sealed_path, result_path, receipt_path, registry_path, instance_id = (
              Path(item) if index < 5 else item
              for index, item in enumerate(sys.argv[1:])
          )
          commitment = json.loads(commitment_path.read_text(encoding="utf-8"))
          sealed = json.loads(sealed_path.read_text(encoding="utf-8"))
          result = json.loads(result_path.read_text(encoding="utf-8"))
          receipt = {
              "schema_version": "1.0",
              "artifact": {
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "url": (
                      "https://github.com/fengyw23/AftermathBench/actions/runs/"
                      + os.environ["GITHUB_RUN_ID"]
                  ),
              },
              "file_sha256": {
                  "result": hashlib.sha256(result_path.read_bytes()).hexdigest(),
                  "pre_model_commitment": hashlib.sha256(
                      commitment_path.read_bytes()
                  ).hexdigest(),
                  "sealed_bundle": hashlib.sha256(sealed_path.read_bytes()).hexdigest(),
              },
              "commitment": commitment,
              "sealed_bundle": sealed,
              "result": result,
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          record = {
              "formal_slot_id": (
                  "forgejo/forgejo-release-package-publication/" + instance_id
              ),
              "scenario_id": commitment["scenario_id"],
              "domain_id": "forgejo",
              "family_id": "forgejo-release-package-publication",
              "instance_id": instance_id,
              "variant_count": result["reference"]["case_count"],
              "freeze_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "public_commitment_sha256": commitment["public_commitment_sha256"],
              "artifact_url": receipt["artifact"]["url"],
              "evidence_path": receipt_path.as_posix(),
              "evidence_sha256": hashlib.sha256(receipt_path.read_bytes()).hexdigest(),
          }
          registry["records"].append(record)
          registry_path.write_text(
              json.dumps(registry, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          python -m unittest discover -s tests -p 'test_frozen_hidden_registry.py' -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$receipt" data/frozen_hidden_candidates.json
          git commit -m "evidence(forgejo): register frozen publication $instance_id"
          git push

      - name: Upload commitment and aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-publication-${{ env.SELECTED_INSTANCE_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/forgejo-candidate/public/
          if-no-files-found: error
          retention-days: 90

      - name: Purge all private state
        if: always()
        run: |
          rm -f runtimes/forgejo/.runtime/credentials.json
          python scripts/manage_forgejo_stack.py purge || true
          rm -rf "$RUNNER_TEMP/forgejo-candidate/private"
