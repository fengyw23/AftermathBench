name: kubernetes-interaction-runtime

on:
  push:
    branches:
      - native-hard-recovery-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-interaction-family:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Run interaction unit tests
        run: |
          python -m unittest discover -s tests -p 'test_kubernetes_interaction*.py' -v
          python -m unittest discover -s tests -p 'test_evidence_projection_witness.py' -v

      - name: Build pinned kind from source
        run: |
          git clone --no-checkout https://github.com/kubernetes-sigs/kind.git "$RUNNER_TEMP/kind"
          git -C "$RUNNER_TEMP/kind" fetch --depth 1 origin 9a205e8c8540557602240f8766d3c95c51c23c4c
          git -C "$RUNNER_TEMP/kind" checkout --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/kind" && go build -trimpath -o "$RUNNER_TEMP/bin/kind" .)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install pinned kubectl
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/kubectl.sha256" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/bin/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/kubectl"

      - name: Start native Kubernetes and registry
        run: |
          python scripts/manage_kubernetes_stack.py up
          docker build --file runtimes/forgejo/control/Containerfile \
            --tag aftermathbench/kubernetes-control:local .
          kind load docker-image --name aftermath-kubernetes aftermathbench/kubernetes-control:local
          docker run --detach --rm --name aftermath-interaction-registry \
            --publish 127.0.0.1:9092:8080 aftermathbench/kubernetes-control:local \
            python -m runtime_services.webhook_sink
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9092/health && break
            sleep 1
          done

      - name: Replay thirteen native boundaries and references
        run: |
          run_root="$RUNNER_TEMP/kubernetes-interaction"
          mkdir -p "$run_root/runtime"
          variants=(
            state_01 state_02 state_03 state_04 state_05 state_06 state_07
            state_08 state_09 state_10 state_11 state_12 state_13
          )
          for variant in "${variants[@]}"; do
            python scripts/run_kubernetes_interaction_boundary.py \
              --variant "$variant" \
              --prefix-output "$run_root/runtime/prefix.json" \
              --output "$run_root/runtime/$variant-boundary.json"
            python scripts/run_kubernetes_interaction_control.py \
              --variant "$variant" \
              --output "$run_root/runtime/$variant-reference.json"
          done
          python scripts/summarize_kubernetes_interaction_runtime.py \
            --run-directory "$run_root/runtime" \
            --output "$run_root/runtime-summary.json" \
            --projection-output "$run_root/projection-witnesses.json"

      - name: Upload interaction replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-interaction-${{ github.run_id }}
          path: ${{ runner.temp }}/kubernetes-interaction/

      - name: Purge native services
        if: always()
        run: |
          docker rm --force aftermath-interaction-registry || true
          python scripts/manage_kubernetes_stack.py down || true
