name: kubernetes-settlement-model

on:
  push:
    branches:
      - kubernetes-settlement-model-dev
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible model identifier
        required: true
        default: glm-5.2
        type: string
      repetitions:
        description: Repetitions for each matched state
        required: true
        default: "1"
        type: string
      execution_control:
        description: Supply the correct recovery scope to isolate execution
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-settlement-model:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      AFTERMATH_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
      AFTERMATH_MODEL_BASE_URL: https://ws-ogjwl5f71op9q2jf.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      SCENARIO: data/scenario_blueprints/k8s-cronjob-settlement-dev-001/scenario.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Select experiment condition
        run: |
          test -n "$AFTERMATH_API_KEY"
          requested_model="${{ inputs.model }}"
          requested_repetitions="${{ inputs.repetitions }}"
          requested_control="${{ inputs.execution_control }}"
          test -n "$requested_model" || requested_model=glm-5.2
          test -n "$requested_repetitions" || requested_repetitions=1
          test -n "$requested_control" || requested_control=false
          echo "MODEL_ID=$requested_model" >> "$GITHUB_ENV"
          echo "REPETITIONS=$requested_repetitions" >> "$GITHUB_ENV"
          echo "EXECUTION_CONTROL=$requested_control" >> "$GITHUB_ENV"
          python -m unittest discover -s tests -v

      - name: Build pinned kind and install pinned kubectl
        run: |
          git clone --no-checkout \
            https://github.com/kubernetes-sigs/kind.git \
            "$RUNNER_TEMP/kind"
          git -C "$RUNNER_TEMP/kind" fetch --depth 1 origin \
            9a205e8c8540557602240f8766d3c95c51c23c4c
          git -C "$RUNNER_TEMP/kind" checkout --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/bin"
          (
            cd "$RUNNER_TEMP/kind"
            go build -trimpath -o "$RUNNER_TEMP/bin/kind" .
          )
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/kubectl.sha256" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/bin/kubectl" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create cluster, worker image and receiver
        run: |
          python scripts/manage_kubernetes_stack.py up
          docker build \
            --file runtimes/forgejo/control/Containerfile \
            --tag aftermathbench/kubernetes-control:local \
            .
          kind load docker-image \
            --name aftermath-kubernetes \
            aftermathbench/kubernetes-control:local
          docker run --detach --rm \
            --name aftermath-settlement-sink \
            --publish 127.0.0.1:9092:8080 \
            aftermathbench/kubernetes-control:local \
            python -m runtime_services.webhook_sink
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9092/health && break
            if [ "$attempt" = 30 ]; then
              docker logs aftermath-settlement-sink || true
              exit 1
            fi
            sleep 1
          done
          run_root="$RUNNER_TEMP/kubernetes-settlement-model"
          mkdir -p "$run_root/model-runs"
          printf '{}\n' > "$run_root/credentials.json"
          {
            echo "schema_version=0.1"
            echo "scenario_sha256=$(sha256sum "$SCENARIO" | cut -d' ' -f1)"
            echo "model=$MODEL_ID"
            echo "repetitions=$REPETITIONS"
            echo "execution_control=$EXECUTION_CONTROL"
            echo "commit=$GITHUB_SHA"
          } > "$run_root/model-runs/manifest.txt"

      - name: Run model on matched settlement boundaries
        run: |
          run_status=0
          run_root="$RUNNER_TEMP/kubernetes-settlement-model"
          variants=(
            job_create_request_not_reached
            job_created_response_lost
            job_created_controller_suspended
            job_created_pod_pending
          )
          for repetition in $(seq 1 "$REPETITIONS")
          do
            run_dir="$run_root/model-runs/repetition-$(printf '%02d' "$repetition")"
            mkdir -p "$run_dir"
            for variant in "${variants[@]}"
            do
              failure_report="$run_dir/${variant}-failure.json"
              trajectory="$run_dir/${variant}.json"
              python scripts/run_kubernetes_settlement_boundary.py \
                --variant "$variant" \
                --prefix-output "$run_root/prefix.json" \
                --output "$failure_report"
              control_flag=()
              if [ "$EXECUTION_CONTROL" = "true" ]; then
                control_flag=(--execution-control)
              fi
              if python -m aftermath_bench run-native-model \
                  --provider openai-compatible \
                  --base-url "$AFTERMATH_MODEL_BASE_URL" \
                  --model "$MODEL_ID" \
                  --scenario "$SCENARIO" \
                  --credentials "$run_root/credentials.json" \
                  --prefix "$run_root/prefix.json" \
                  --failure-report "$failure_report" \
                  --max-turns 25 \
                  "${control_flag[@]}" \
                  --output "$trajectory"
              then
                true
              elif [ ! -s "$trajectory" ]; then
                run_status=1
              fi
            done
          done
          python scripts/summarize_native_model_runs.py \
            --run-directory "$run_root/model-runs" \
            --scenario "$SCENARIO" \
            --output "$run_root/model-runs/summary.json" \
            --expected-execution-control "$EXECUTION_CONTROL" \
            || run_status=1
          exit "$run_status"

      - name: Capture and sanitize diagnostics
        if: always()
        run: |
          run_root="$RUNNER_TEMP/kubernetes-settlement-model"
          kubectl --context kind-aftermath-kubernetes get all \
            --all-namespaces -o wide \
            > "$run_root/all-resources.txt" 2>&1 || true
          kubectl --context kind-aftermath-kubernetes get events \
            --all-namespaces \
            > "$run_root/events.txt" 2>&1 || true
          rm -f "$run_root/credentials.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-settlement-model-output
          path: |
            ${{ runner.temp }}/kubernetes-settlement-model/model-runs/
            ${{ runner.temp }}/kubernetes-settlement-model/prefix.json
            ${{ runner.temp }}/kubernetes-settlement-model/all-resources.txt
            ${{ runner.temp }}/kubernetes-settlement-model/events.txt
          if-no-files-found: warn

      - name: Purge native services
        if: always()
        run: |
          docker rm --force aftermath-settlement-sink || true
          python scripts/manage_kubernetes_stack.py down || true
