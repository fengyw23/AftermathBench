name: erpnext-sales-return-native-validation

on:
  push:
    branches:
      - native-sales-return-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-native-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      AFTERMATH_DB_ROOT_PASSWORD: aftermath-root
      AFTERMATH_ADMIN_PASSWORD: aftermath-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate code and pinned runtime metadata
        run: |
          python -m unittest discover -s tests -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned ERPNext and Frappe from source
        run: |
          python scripts/build_erpnext_runtime.py \
            --source-directory "$RUNNER_TEMP/frappe_docker" \
            --execute

      - name: Build and validate the sales-return prefix
        run: |
          run_root="runtimes/erpnext/.runtime/sales-return"
          mkdir -p "$run_root"
          python scripts/manage_erpnext_stack.py up
          python scripts/manage_erpnext_stack.py setup
          python scripts/build_erpnext_sales_return_prefix.py \
            --scenario data/scenario_blueprints/erpnext-sales-return-dev-001/scenario.json \
            --credentials runtimes/erpnext/.runtime/credentials.json \
            --output "$run_root/prefix.json"
          python scripts/validate_erpnext_sales_return_prefix.py \
            --credentials runtimes/erpnext/.runtime/credentials.json \
            --prefix "$run_root/prefix.json" \
            --output "$run_root/prefix-validation.json"
          python scripts/manage_erpnext_stack.py snapshot \
            --snapshot "$run_root/prefix.sql"

      - name: Replay all four native failure boundaries
        run: |
          run_root="runtimes/erpnext/.runtime/sales-return"
          mkdir -p "$run_root/failures"
          variants=(
            request_not_reached
            database_committed_response_lost
            after_commit_enqueue_failed
            async_job_pending
          )
          baselines=(
            no_op
            blind_retry
            assume_committed
            repair_failed_record_only
            all_rollback
            cancel_shared_payment
            compact_boundary_tree
          )
          for variant in "${variants[@]}"
          do
            for baseline in "${baselines[@]}"
            do
              python scripts/run_erpnext_sales_return_failure.py \
                --variant "$variant" \
                --credentials runtimes/erpnext/.runtime/credentials.json \
                --prefix "$run_root/prefix.json" \
                --snapshot "$run_root/prefix.sql" \
                --output "$run_root/failures/${variant}-baseline-${baseline}-failure.json"
              python scripts/run_erpnext_sales_return_baseline.py \
                --baseline "$baseline" \
                --variant "$variant" \
                --credentials runtimes/erpnext/.runtime/credentials.json \
                --prefix "$run_root/prefix.json" \
                --output "$run_root/failures/${variant}-baseline-${baseline}.json"
            done
            python scripts/run_erpnext_sales_return_failure.py \
              --variant "$variant" \
              --credentials runtimes/erpnext/.runtime/credentials.json \
              --prefix "$run_root/prefix.json" \
              --snapshot "$run_root/prefix.sql" \
              --output "$run_root/failures/${variant}.json"
            python scripts/run_erpnext_sales_return_control.py \
              --variant "$variant" \
              --credentials runtimes/erpnext/.runtime/credentials.json \
              --prefix "$run_root/prefix.json" \
              --output "$run_root/failures/${variant}-reference.json"
          done

      - name: Build and audit replay-derived admission
        run: |
          run_root="runtimes/erpnext/.runtime/sales-return"
          scenario="data/scenarios/erpnext-sales-return-dev-001/scenario.json"
          artifact_dir="data/scenarios/erpnext-sales-return-dev-001/artifacts"
          mkdir -p "$artifact_dir"
          cp "$run_root/prefix.json" "$artifact_dir/prefix.json"
          python scripts/build_native_sales_return_admission.py \
            --prefix "$run_root/prefix.json" \
            --control-directory "$run_root/failures" \
            --output-directory "$artifact_dir"
          python -m aftermath_bench validate-native-scenario \
            --scenario "$scenario" \
            --execute \
            > "$run_root/admission.json"

      - name: Remove credentials
        if: always()
        run: |
          rm -f runtimes/erpnext/.runtime/credentials.json

      - name: Upload native prefix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-sales-return-prefix-${{ github.run_id }}
          path: |
            runtimes/erpnext/.runtime/sales-return/prefix.json
            runtimes/erpnext/.runtime/sales-return/prefix-validation.json
            runtimes/erpnext/.runtime/sales-return/failures/
            runtimes/erpnext/.runtime/sales-return/admission.json
            data/scenarios/erpnext-sales-return-dev-001/artifacts/
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        run: |
          python scripts/manage_erpnext_stack.py down || true
