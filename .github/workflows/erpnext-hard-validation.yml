name: erpnext-native-hard-validation

on:
  workflow_dispatch:
    inputs:
      split:
        description: Native instance to validate and freeze
        required: true
        default: development
        type: choice
        options:
          - development
          - holdout
  push:
    branches:
      - native-hard-recovery-v1
    paths:
      - ".github/workflows/erpnext-hard-validation.yml"
      - "data/scenarios/erpnext-partial-return-*/**"
      - "runtimes/erpnext/**"
      - "scripts/*erpnext*return*.py"
      - "scripts/build_native_return_admission.py"
      - "src/aftermath_bench/native_*.py"
      - "src/aftermath_bench/integrations/erpnext_return_*.py"
      - "src/aftermath_bench/integrations/erpnext_stack.py"

permissions:
  contents: read

jobs:
  validate-hard-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      AFTERMATH_DB_ROOT_PASSWORD: aftermath-root
      AFTERMATH_ADMIN_PASSWORD: aftermath-admin
    steps:
      - uses: actions/checkout@v4
        with:
          # The full validation suite replays historical novelty seals and
          # archives their source commits. A shallow clone makes those
          # cryptographic provenance checks fail before ERPNext is built.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select native instance
        run: |
          if [ "${{ inputs.split }}" = "holdout" ]
          then
            scenario_id=erpnext-partial-return-holdout-001
            run_name=hard-holdout
          else
            scenario_id=erpnext-partial-return-dev-001
            run_name=hard-dev
          fi
          echo "SCENARIO_ID=$scenario_id" >> "$GITHUB_ENV"
          echo "SCENARIO=data/scenarios/${scenario_id}/scenario.json" >> "$GITHUB_ENV"
          echo "RUN_ROOT=runtimes/erpnext/.runtime/${run_name}" >> "$GITHUB_ENV"

      - name: Validate code before building ERPNext
        run: |
          python -m unittest discover -s tests -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned ERPNext and Frappe from source
        run: |
          python scripts/build_erpnext_runtime.py \
            --source-directory "$RUNNER_TEMP/frappe_docker" \
            --execute

      - name: Start native runtime and build selected prefix
        run: |
          mkdir -p "$RUN_ROOT"
          python scripts/manage_erpnext_stack.py up
          python scripts/manage_erpnext_stack.py setup
          python scripts/build_erpnext_return_prefix.py \
            --scenario "$SCENARIO" \
            --credentials runtimes/erpnext/.runtime/credentials.json \
            --output "$RUN_ROOT/prefix.json"
          python scripts/manage_erpnext_stack.py snapshot \
            --snapshot "$RUN_ROOT/prefix.sql"

      - name: Replay every hidden boundary and reference recovery
        run: |
          variants=(
            request_not_reached
            database_committed_response_lost
            after_commit_enqueue_failed
            async_job_pending
          )
          baselines=(
            no_op
            blind_retry
            assume_committed
            repair_failed_record_only
            all_rollback
            cancel_shared_payment
            compact_boundary_tree
          )
          for variant in "${variants[@]}"
          do
            for baseline in "${baselines[@]}"
            do
              python scripts/run_erpnext_return_failure.py \
                --variant "$variant" \
                --credentials runtimes/erpnext/.runtime/credentials.json \
                --prefix "$RUN_ROOT/prefix.json" \
                --snapshot "$RUN_ROOT/prefix.sql" \
                --output "$RUN_ROOT/${variant}-baseline-${baseline}-failure.json"
              python scripts/run_erpnext_return_baseline.py \
                --baseline "$baseline" \
                --variant "$variant" \
                --credentials runtimes/erpnext/.runtime/credentials.json \
                --prefix "$RUN_ROOT/prefix.json" \
                --output "$RUN_ROOT/${variant}-baseline-${baseline}.json"
            done
            python scripts/run_erpnext_return_failure.py \
              --variant "$variant" \
              --credentials runtimes/erpnext/.runtime/credentials.json \
              --prefix "$RUN_ROOT/prefix.json" \
              --snapshot "$RUN_ROOT/prefix.sql" \
              --output "$RUN_ROOT/${variant}-failure.json"
            python scripts/run_erpnext_return_control.py \
              --variant "$variant" \
              --credentials runtimes/erpnext/.runtime/credentials.json \
              --prefix "$RUN_ROOT/prefix.json" \
              --output "$RUN_ROOT/${variant}-control.json"
          done

      - name: Build and audit replay-derived admission
        run: |
          artifact_dir="data/scenarios/${SCENARIO_ID}/artifacts"
          mkdir -p "$artifact_dir"
          cp "$RUN_ROOT/prefix.json" "$artifact_dir/prefix.json"
          python scripts/build_native_return_admission.py \
            --prefix "$RUN_ROOT/prefix.json" \
            --control-directory "$RUN_ROOT" \
            --output-directory "$artifact_dir"
          python -m aftermath_bench validate-native-scenario \
            --scenario "$SCENARIO" \
            --execute

      - name: Capture compose diagnostics
        if: always()
        run: |
          mkdir -p runtimes/erpnext/.runtime
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            ps --all \
            > runtimes/erpnext/.runtime/compose-ps.txt 2>&1 || true
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            logs --no-color \
            > runtimes/erpnext/.runtime/compose.log 2>&1 || true

      - name: Remove ephemeral credentials and database dump
        if: always()
        run: |
          rm -f runtimes/erpnext/.runtime/credentials.json
          rm -f runtimes/erpnext/.runtime/hard-dev/prefix.sql
          rm -f runtimes/erpnext/.runtime/hard-holdout/prefix.sql

      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-native-hard-validation
          include-hidden-files: true
          path: |
            runtimes/erpnext/.runtime/hard-dev/
            runtimes/erpnext/.runtime/hard-holdout/
            runtimes/erpnext/.runtime/compose-ps.txt
            runtimes/erpnext/.runtime/compose.log
            data/scenarios/erpnext-partial-return-dev-001/artifacts/
            data/scenarios/erpnext-partial-return-holdout-001/artifacts/
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        run: python scripts/manage_erpnext_stack.py purge
