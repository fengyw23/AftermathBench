name: forgejo-cross-system-reconciliation-runtime

on:
  push:
    branches:
      - native-hard-recovery-v1
    paths:
      - '.github/workflows/forgejo-reconciliation-runtime.yml'
      - 'scripts/*forgejo_reconciliation*'
      - 'scripts/build_forgejo_promotion_prefix.py'
      - 'scripts/manage_forgejo_stack.py'
      - 'src/aftermath_bench/integrations/deployment_target_api.py'
      - 'src/aftermath_bench/integrations/forgejo_promotion_*.py'
      - 'src/aftermath_bench/integrations/forgejo_reconciliation_*.py'
      - 'src/aftermath_bench/runtime_services/deployment_target.py'
      - 'tests/test_deployment_target.py'
      - 'tests/test_forgejo_promotion_*.py'
      - 'tests/test_forgejo_reconciliation_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-independent-gaps:
    name: replay-independent-gaps (${{ matrix.instance_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance_id: public-dev-001
            instance: data/instance_specs/forgejo-approved-artifact-promotion-public-dev-001.json
          - instance_id: public-dev-002
            instance: data/instance_specs/forgejo-approved-artifact-promotion-public-dev-002.json
    env:
      PYTHONPATH: src
      AFTERMATH_FORGEJO_ADMIN_PASSWORD: aftermath-admin
      INSTANCE: ${{ matrix.instance }}
      RUN_ROOT: runtimes/forgejo/.runtime/reconciliation-${{ matrix.instance_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate reconciliation contracts
        run: |
          python -m unittest discover -s tests -p 'test_deployment_target.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_promotion_*.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_reconciliation_*.py' -v

      - name: Build pinned Forgejo from audited source
        run: |
          mkdir -p "$RUN_ROOT"
          python scripts/build_forgejo_runtime.py \
            --source-directory "$RUNNER_TEMP/forgejo" \
            --checkout \
            --build \
            --report "$RUN_ROOT/source-verification.json"

      - name: Start native services and runner
        run: |
          python scripts/manage_forgejo_stack.py up
          python scripts/manage_forgejo_stack.py setup \
            --username aftermath \
            --email aftermath@aftermath.invalid
          python scripts/manage_forgejo_stack.py setup-runner

      - name: Build and freeze the common prefix
        run: |
          python scripts/build_forgejo_promotion_prefix.py \
            --credentials runtimes/forgejo/.runtime/credentials.json \
            --instance-spec "$INSTANCE" \
            --output "$RUN_ROOT/prefix.json"
          python scripts/manage_forgejo_stack.py snapshot-promotion-bundle \
            --snapshot "$RUN_ROOT/prefix-bundle"

      - name: Replay six independent-gap boundaries and references
        run: |
          variants=(
            all_effects_valid_response_lost
            actions_bundle_missing
            artifact_registry_missing
            production_deployment_missing
            external_attestation_missing
            release_metadata_missing
          )
          for variant in "${variants[@]}"
          do
            python scripts/manage_forgejo_stack.py restore-promotion-bundle \
              --snapshot "$RUN_ROOT/prefix-bundle"
            python scripts/run_forgejo_reconciliation_boundary.py \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --prefix "$RUN_ROOT/prefix.json" \
              --instance-spec "$INSTANCE" \
              --variant "$variant" \
              --output "$RUN_ROOT/$variant-boundary.json"
            python scripts/manage_forgejo_stack.py snapshot-promotion-bundle \
              --snapshot "$RUN_ROOT/$variant-bundle"
            python scripts/manage_forgejo_stack.py restore-promotion-bundle \
              --snapshot "$RUN_ROOT/$variant-bundle"
            python scripts/run_forgejo_reconciliation_reference.py \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --prefix "$RUN_ROOT/prefix.json" \
              --instance-spec "$INSTANCE" \
              --variant "$variant" \
              --output "$RUN_ROOT/$variant-reference.json"
          done

      - name: Reconstruct and enforce replayed scope depth
        run: |
          python scripts/audit_forgejo_reconciliation_runtime.py \
            --run-root "$RUN_ROOT" \
            --output "$RUN_ROOT/boundary-audit.json"

      - name: Execute and reject fixed recovery policies
        run: |
          variants=(
            all_effects_valid_response_lost
            actions_bundle_missing
            artifact_registry_missing
            production_deployment_missing
            external_attestation_missing
            release_metadata_missing
          )
          mapfile -t baselines < <(
            python -c 'from aftermath_bench.integrations.forgejo_reconciliation_baselines import FORGEJO_RECONCILIATION_BASELINES; print(*FORGEJO_RECONCILIATION_BASELINES, sep="\n")'
          )
          mkdir -p "$RUN_ROOT/baselines"
          for baseline in "${baselines[@]}"
          do
            for variant in "${variants[@]}"
            do
              python scripts/manage_forgejo_stack.py restore-promotion-bundle \
                --snapshot "$RUN_ROOT/$variant-bundle"
              timeout 90s python scripts/run_forgejo_reconciliation_baseline.py \
                --credentials runtimes/forgejo/.runtime/credentials.json \
                --prefix "$RUN_ROOT/prefix.json" \
                --instance-spec "$INSTANCE" \
                --variant "$variant" \
                --baseline "$baseline" \
                --output "$RUN_ROOT/baselines/$baseline-$variant.json"
            done
          done
          python scripts/summarize_forgejo_reconciliation_baselines.py \
            --run-directory "$RUN_ROOT/baselines" \
            --scenario-id "forgejo-cross-system-reconciliation-${{ matrix.instance_id }}" \
            --output "$RUN_ROOT/baseline-summary.json"

      - name: Surface native logs on failure
        if: failure()
        run: |
          docker compose \
            --project-name aftermath-forgejo \
            --file runtimes/forgejo/compose.yaml \
            logs --no-color --tail 350 \
            forgejo runner-daemon deployment-target deployment-fault-gateway \
            webhook-sink webhook-fault-gateway

      - name: Upload native replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-cross-system-reconciliation-${{ matrix.instance_id }}-${{ github.run_id }}
          path: ${{ env.RUN_ROOT }}
          if-no-files-found: error

      - name: Tear down services
        if: always()
        run: python scripts/manage_forgejo_stack.py purge
