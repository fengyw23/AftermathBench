name: forgejo-cross-system-reconciliation-model

on:
  push:
    branches:
      - native-hard-recovery-v1
    paths:
      - .github/workflows/forgejo-reconciliation-model.yml
      - src/aftermath_bench/native_model_runner.py
      - src/aftermath_bench/native_forgejo_reconciliation_family.py
      - src/aftermath_bench/integrations/forgejo_reconciliation_agent.py
      - data/scenario_blueprints/forgejo-cross-system-reconciliation-*/scenario.json
      - tests/test_native_run_bindings.py
      - tests/test_native_forgejo_reconciliation_family.py
      - tests/test_forgejo_reconciliation_model_workflow.py
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible model identifier
        required: true
        default: glm-5.2
        type: string
      repetitions:
        description: Independent runs per matched boundary
        required: true
        default: "1"
        type: string
      instance_id:
        description: Frozen public development instance
        required: true
        default: public-dev-001
        type: choice
        options:
          - public-dev-001
          - public-dev-002
      execution_control:
        description: Supply the correct evidence-to-repair mapping
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evaluate-reconciliation-family:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: src
      AFTERMATH_FORGEJO_ADMIN_PASSWORD: aftermath-admin
      AFTERMATH_API_KEY: ${{ secrets.ZHIPU_CODING_API_KEY }}
      AFTERMATH_MODEL_BASE_URL: https://open.bigmodel.cn/api/coding/paas/v4
      MODEL_ID: ${{ inputs.model || 'glm-5.2' }}
      REPETITIONS: ${{ inputs.repetitions || '1' }}
      INSTANCE_ID: ${{ inputs.instance_id || 'public-dev-001' }}
      EXECUTION_CONTROL: ${{ github.event_name == 'push' && 'true' || inputs.execution_control || 'false' }}
      RUN_ROOT: runtimes/forgejo/.runtime/reconciliation-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate model interface and inputs
        run: |
          set -euo pipefail
          test -n "$AFTERMATH_API_KEY"
          case "$REPETITIONS" in
            ''|*[!0-9]*|0) echo "repetitions must be positive" >&2; exit 2 ;;
          esac
          python -m unittest discover -s tests -p 'test_native_forgejo_reconciliation_family.py' -v
          python -m unittest discover -s tests -p 'test_forgejo_reconciliation_model_workflow.py' -v
          python -m unittest discover -s tests -p 'test_native_model_runner.py' -v
          python -m unittest discover -s tests -p 'test_native_run_bindings.py' -v
          mkdir -p "$RUN_ROOT/runtime" "$RUN_ROOT/bundles" "$RUN_ROOT/runs"

      - name: Build native boundaries from the selected instance
        run: |
          set -euo pipefail
          INSTANCE="data/instance_specs/forgejo-approved-artifact-promotion-$INSTANCE_ID.json"
          SCENARIO="data/scenario_blueprints/forgejo-cross-system-reconciliation-$INSTANCE_ID/scenario.json"
          python scripts/build_forgejo_runtime.py \
            --source-directory "$RUNNER_TEMP/forgejo" --checkout --build \
            --report "$RUN_ROOT/runtime/source-verification.json"
          python scripts/manage_forgejo_stack.py up
          python scripts/manage_forgejo_stack.py setup \
            --username aftermath --email aftermath@aftermath.invalid
          python scripts/manage_forgejo_stack.py setup-runner
          python scripts/build_forgejo_promotion_prefix.py \
            --credentials runtimes/forgejo/.runtime/credentials.json \
            --instance-spec "$INSTANCE" \
            --output "$RUN_ROOT/runtime/prefix.json"
          python scripts/manage_forgejo_stack.py snapshot-promotion-bundle \
            --snapshot "$RUN_ROOT/bundles/prefix"
          mapfile -t variants < <(
            python -c 'import json,sys; print(*[x["id"] for x in json.load(open(sys.argv[1]))["matched_variants"]], sep="\n")' "$SCENARIO"
          )
          for variant in "${variants[@]}"
          do
            python scripts/manage_forgejo_stack.py restore-promotion-bundle \
              --snapshot "$RUN_ROOT/bundles/prefix"
            python scripts/run_forgejo_reconciliation_boundary.py \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --instance-spec "$INSTANCE" \
              --variant "$variant" \
              --output "$RUN_ROOT/runtime/$variant.json"
            python scripts/manage_forgejo_stack.py snapshot-promotion-bundle \
              --snapshot "$RUN_ROOT/bundles/boundary-$variant"
          done
          cp "$RUN_ROOT/runtime/prefix.json" "$RUN_ROOT/prefix.json"
          for variant in "${variants[@]}"
          do
            cp "$RUN_ROOT/runtime/$variant.json" "$RUN_ROOT/$variant-boundary.json"
            python scripts/manage_forgejo_stack.py restore-promotion-bundle \
              --snapshot "$RUN_ROOT/bundles/boundary-$variant"
            python scripts/run_forgejo_reconciliation_reference.py \
              --credentials runtimes/forgejo/.runtime/credentials.json \
              --prefix "$RUN_ROOT/runtime/prefix.json" \
              --instance-spec "$INSTANCE" \
              --variant "$variant" \
              --output "$RUN_ROOT/$variant-reference.json"
          done
          python scripts/audit_forgejo_reconciliation_runtime.py \
            --run-root "$RUN_ROOT" \
            --output "$RUN_ROOT/runtime/boundary-audit.json"

      - name: Run matched-group model evaluation
        run: |
          set -euo pipefail
          INSTANCE="data/instance_specs/forgejo-approved-artifact-promotion-$INSTANCE_ID.json"
          SCENARIO="data/scenario_blueprints/forgejo-cross-system-reconciliation-$INSTANCE_ID/scenario.json"
          mapfile -t variants < <(
            python -c 'import json,sys; print(*[x["id"] for x in json.load(open(sys.argv[1]))["matched_variants"]], sep="\n")' "$SCENARIO"
          )
          run_status=0
          for repetition in $(seq 1 "$REPETITIONS")
          do
            run_dir="$RUN_ROOT/runs/repetition-$(printf '%02d' "$repetition")"
            mkdir -p "$run_dir"
            for variant in "${variants[@]}"
            do
              output="$run_dir/$variant.json"
              control_flag=()
              if [ "$EXECUTION_CONTROL" = "true" ]; then
                control_flag=(--execution-control)
              fi
              for attempt in 1 2
              do
                rm -f "$output"
                python scripts/manage_forgejo_stack.py restore-promotion-bundle \
                  --snapshot "$RUN_ROOT/bundles/boundary-$variant" \
                  > "$run_dir/$variant-attempt-$attempt-restore.log" 2>&1
                python -m aftermath_bench run-native-model \
                  --provider openai-compatible \
                  --base-url "$AFTERMATH_MODEL_BASE_URL" \
                  --model "$MODEL_ID" \
                  --scenario "$SCENARIO" \
                  --credentials runtimes/forgejo/.runtime/credentials.json \
                  --prefix "$RUN_ROOT/runtime/prefix.json" \
                  --failure-report "$RUN_ROOT/runtime/$variant.json" \
                  --max-turns 35 \
                  --model-timeout-seconds 600 \
                  "${control_flag[@]}" \
                  --output "$output" \
                  > "$run_dir/$variant-attempt-$attempt.log" 2>&1 || true
                [ -s "$output" ] && break
              done
              if [ ! -s "$output" ]; then run_status=1; fi
            done
          done
          python scripts/summarize_native_model_runs.py \
            --run-directory "$RUN_ROOT/runs" \
            --scenario "$SCENARIO" \
            --expected-execution-control "$EXECUTION_CONTROL" \
            --output "$RUN_ROOT/runs/summary.json" || run_status=1
          exit "$run_status"

      - name: Capture diagnostics and remove credentials
        if: always()
        run: |
          rm -f runtimes/forgejo/.runtime/credentials.json
          docker compose --project-name aftermath-forgejo \
            --file runtimes/forgejo/compose.yaml ps --all \
            > "$RUN_ROOT/runtime/compose-ps.txt" 2>&1 || true
          docker compose --project-name aftermath-forgejo \
            --file runtimes/forgejo/compose.yaml logs --no-color \
            > "$RUN_ROOT/runtime/compose.log" 2>&1 || true

      - name: Upload complete model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-reconciliation-model-${{ env.INSTANCE_ID }}-${{ github.run_id }}
          include-hidden-files: true
          path: ${{ env.RUN_ROOT }}
          if-no-files-found: error
          retention-days: 90

      - name: Tear down services and remove snapshots
        if: always()
        run: |
          python scripts/manage_forgejo_stack.py purge || true
          rm -rf "$RUN_ROOT/bundles"
