name: forgejo-credential-recovery-smoke

on:
  push:
    branches:
      - forgejo-credential-recovery-smoke

permissions:
  contents: read

jobs:
  restored-credential-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      FROZEN_SOURCE_COMMIT: af0b76c6a5d34cbe5a0882dfd00ff37f75fbf9c3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize exact hidden-evaluation source
        run: |
          source_root="$RUNNER_TEMP/aftermath-frozen-source"
          git worktree add --detach "$source_root" "$FROZEN_SOURCE_COMMIT"

      - name: Build and initialize public smoke state
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/aftermath-frozen-source"
          cd "$source_root"
          PYTHONPATH=src python scripts/build_forgejo_runtime.py \
            --source-directory "$RUNNER_TEMP/forgejo" \
            --checkout \
            --build \
            --report "$RUNNER_TEMP/source-verification.json" \
            > "$RUNNER_TEMP/source-build.log" 2>&1
          PYTHONPATH=src python scripts/manage_forgejo_stack.py up
          PYTHONPATH=src python scripts/manage_forgejo_stack.py setup \
            --username credential-smoke \
            --email credential-smoke@aftermath.invalid
          PYTHONPATH="$GITHUB_WORKSPACE/src" python \
            "$GITHUB_WORKSPACE/scripts/smoke_forgejo_credentials.py" \
            --credentials runtimes/forgejo/.runtime/credentials.json \
            --output "$RUNNER_TEMP/pre-restore-smoke.json"
          PYTHONPATH=src python scripts/manage_forgejo_stack.py snapshot-bundle \
            --snapshot "$RUNNER_TEMP/credential-smoke-snapshot"

      - name: Restore state, recover credentials and verify both auth paths
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/aftermath-frozen-source"
          cd "$source_root"
          PYTHONPATH=src python scripts/manage_forgejo_stack.py restore-bundle \
            --snapshot "$RUNNER_TEMP/credential-smoke-snapshot"
          PYTHONPATH=src python \
            "$GITHUB_WORKSPACE/scripts/recover_forgejo_evaluation_credentials.py" \
            --compose-file runtimes/forgejo/compose.yaml \
            --username credential-smoke \
            --token-name restored-credential-smoke \
            --output runtimes/forgejo/.runtime/credentials.json
          PYTHONPATH=src python \
            "$GITHUB_WORKSPACE/scripts/smoke_forgejo_credentials.py" \
            --credentials runtimes/forgejo/.runtime/credentials.json \
            --output "$RUNNER_TEMP/post-restore-smoke.json"

      - name: Upload non-sensitive smoke results
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-credential-recovery-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pre-restore-smoke.json
            ${{ runner.temp }}/post-restore-smoke.json
          if-no-files-found: error
          retention-days: 90

      - name: Purge runtime
        if: always()
        run: |
          source_root="$RUNNER_TEMP/aftermath-frozen-source"
          if [ -d "$source_root" ]
          then
            cd "$source_root"
            PYTHONPATH=src python scripts/manage_forgejo_stack.py purge || true
            rm -f runtimes/forgejo/.runtime/credentials.json
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$source_root" || true
          fi
