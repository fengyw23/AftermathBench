name: kubernetes-constraint-runtime

on:
  push:
    branches:
      - native-hard-recovery-v1
    paths:
      - "data/scenario_blueprints/k8s-constraint-scope-*/**"
      - "data/scenarios/k8s-schema-rollout-*/**"
      - "runtimes/kubernetes/**"
      - "scripts/*kubernetes_constraint*.py"
      - "src/aftermath_bench/native_admission.py"
      - "src/aftermath_bench/native_kubernetes_constraint_family.py"
      - "src/aftermath_bench/integrations/kubernetes_constraint_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-native-constraint-family:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONPATH: src
      SCENARIO: data/scenario_blueprints/k8s-constraint-scope-dev-004/scenario.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Run deterministic tests
        run: |
          python -m unittest discover -s tests -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned kind from source
        run: |
          git clone --no-checkout https://github.com/kubernetes-sigs/kind.git "$RUNNER_TEMP/kind"
          git -C "$RUNNER_TEMP/kind" fetch --depth 1 origin 9a205e8c8540557602240f8766d3c95c51c23c4c
          git -C "$RUNNER_TEMP/kind" checkout --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/kind" && go build -trimpath -o "$RUNNER_TEMP/bin/kind" .)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install pinned kubectl
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/kubectl.sha256" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/bin/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/kubectl"

      - name: Start native Kubernetes and registry
        run: |
          python scripts/manage_kubernetes_stack.py up
          docker build --file runtimes/forgejo/control/Containerfile \
            --tag aftermathbench/kubernetes-control:local .
          kind load docker-image --name aftermath-kubernetes aftermathbench/kubernetes-control:local
          docker run --detach --rm --name aftermath-constraint-registry \
            --publish 127.0.0.1:9092:8080 aftermathbench/kubernetes-control:local \
            python -m runtime_services.webhook_sink
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9092/health && break
            sleep 1
          done

      - name: Replay four references and fixed policies
        run: |
          run_root="$RUNNER_TEMP/kubernetes-constraint"
          mkdir -p "$run_root/runtime" "$run_root/baselines"
          variants=(
            failed_migration_without_preparation
            failed_migration_with_preparation
            committed_cutover_without_publication
            committed_cutover_with_publication
          )
          baselines=(
            no_op
            blind_retry
            always_discard
            always_compensate_and_discard
            always_publish
            always_close_only
          )
          for variant in "${variants[@]}"; do
            python scripts/run_kubernetes_constraint_boundary.py \
              --variant "$variant" \
              --prefix-output "$run_root/runtime/prefix.json" \
              --output "$run_root/runtime/$variant-boundary.json"
            python scripts/run_kubernetes_constraint_control.py \
              --variant "$variant" \
              --output "$run_root/runtime/$variant-reference.json"
            for baseline in "${baselines[@]}"; do
              python scripts/run_kubernetes_constraint_boundary.py \
                --variant "$variant" \
                --output "$run_root/baselines/$baseline-$variant-boundary.json"
              python scripts/run_kubernetes_constraint_baseline.py \
                --baseline "$baseline" \
                --variant "$variant" \
                --output "$run_root/baselines/$baseline-$variant.json"
            done
          done
          python scripts/summarize_native_baselines.py \
            --run-directory "$run_root/baselines" \
            --scenario "$SCENARIO" \
            --output "$run_root/baselines/summary.json"
          python scripts/build_kubernetes_constraint_admission.py \
            --run-directory "$run_root" \
            --output-directory "$run_root/admitted-scenario"

      - name: Upload replay and admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-constraint-${{ github.run_id }}
          path: ${{ runner.temp }}/kubernetes-constraint/

      - name: Purge native services
        if: always()
        run: |
          docker rm --force aftermath-constraint-registry || true
          python scripts/manage_kubernetes_stack.py down || true
