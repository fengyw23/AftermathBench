name: erpnext-hidden-candidate

on:
  push:
    branches:
      - erpnext-hidden-candidate
      - erpnext-hidden-manufacturing-v2-candidate
      - erpnext-hidden-manufacturing-v3-candidate
      - erpnext-hidden-multiwarehouse-candidate
      - erpnext-hidden-multiwarehouse-v2-candidate
      - erpnext-hidden-sales-return-test-001
      - erpnext-hidden-sales-return-test-002
  workflow_dispatch:
    inputs:
      family:
        description: Native ERPNext recovery family
        required: true
        type: choice
        options:
          - manufacturing
          - multiwarehouse
          - sales_return
      instance_id:
        description: Formal hidden slot
        required: true
        default: test-001
        type: choice
        options:
          - test-001
          - test-002
          - test-003

permissions:
  contents: write

jobs:
  replay-admit-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      PYTHONPATH: src
      AFTERMATH_DB_ROOT_PASSWORD: aftermath-root
      AFTERMATH_ADMIN_PASSWORD: aftermath-admin
      SELECTED_FAMILY: ${{ inputs.family || ((github.ref_name == 'erpnext-hidden-multiwarehouse-candidate' || github.ref_name == 'erpnext-hidden-multiwarehouse-v2-candidate') && 'multiwarehouse' || (github.ref_name == 'erpnext-hidden-sales-return-test-001' || github.ref_name == 'erpnext-hidden-sales-return-test-002') && 'sales_return' || 'manufacturing') }}
      SELECTED_INSTANCE_ID: ${{ inputs.instance_id || (github.ref_name == 'erpnext-hidden-sales-return-test-002' && 'test-002' || github.ref_name == 'erpnext-hidden-multiwarehouse-v2-candidate' && 'test-002' || github.ref_name == 'erpnext-hidden-manufacturing-v3-candidate' && 'test-003' || github.ref_name == 'erpnext-hidden-manufacturing-v2-candidate' && 'test-002' || 'test-001') }}
      # Each slot has an independent, freshly generated secret.  Select the
      # slot-specific value first: falling through to an older test-001 secret
      # silently reused consumed instances and made the replay result invalid.
      HIDDEN_INSTANCE_B64: ${{ (inputs.family || ((github.ref_name == 'erpnext-hidden-multiwarehouse-candidate' || github.ref_name == 'erpnext-hidden-multiwarehouse-v2-candidate') && 'multiwarehouse' || 'manufacturing')) == 'manufacturing' && ((inputs.instance_id || (github.ref_name == 'erpnext-hidden-manufacturing-v3-candidate' && 'test-003' || github.ref_name == 'erpnext-hidden-manufacturing-v2-candidate' && 'test-002' || 'test-001')) == 'test-003' && secrets.ERPNEXT_MANUFACTURING_HIDDEN_INSTANCE_B64_V3 || (inputs.instance_id || (github.ref_name == 'erpnext-hidden-manufacturing-v2-candidate' && 'test-002' || 'test-001')) == 'test-002' && secrets.ERPNEXT_MANUFACTURING_HIDDEN_INSTANCE_B64_V5 || secrets.ERPNEXT_MANUFACTURING_HIDDEN_INSTANCE_B64_V4 || secrets.ERPNEXT_MANUFACTURING_HIDDEN_INSTANCE_B64) || ((inputs.instance_id || (github.ref_name == 'erpnext-hidden-multiwarehouse-v2-candidate' && 'test-002' || 'test-001')) == 'test-002' && secrets.ERPNEXT_MULTIWAREHOUSE_HIDDEN_INSTANCE_B64_V2 || secrets.ERPNEXT_MULTIWAREHOUSE_HIDDEN_INSTANCE_B64_V3 || secrets.ERPNEXT_MULTIWAREHOUSE_HIDDEN_INSTANCE_B64) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select a native family without materializing hidden data
        run: |
          case "$SELECTED_FAMILY" in
            manufacturing)
              echo "TEMPLATE=data/scenario_blueprints/erpnext-manufacturing-rework-dev-001/scenario.json" >> "$GITHUB_ENV"
              echo "PREFIX_SCRIPT=scripts/build_erpnext_manufacturing_prefix.py" >> "$GITHUB_ENV"
              echo "FAILURE_SCRIPT=scripts/run_erpnext_manufacturing_failure.py" >> "$GITHUB_ENV"
              echo "CONTROL_SCRIPT=scripts/run_erpnext_manufacturing_control.py" >> "$GITHUB_ENV"
              echo "BASELINE_SCRIPT=scripts/run_erpnext_manufacturing_baseline.py" >> "$GITHUB_ENV"
              echo "ADMISSION_SCRIPT=scripts/build_erpnext_manufacturing_admission.py" >> "$GITHUB_ENV"
              echo "BASELINES=no_op blind_retry assume_committed repair_failed_record_only all_rollback cancel_accepted_output duplicate_corrective" >> "$GITHUB_ENV"
              ;;
            multiwarehouse)
              echo "TEMPLATE=data/scenario_blueprints/erpnext-multiwarehouse-transfer-dev-001/scenario.json" >> "$GITHUB_ENV"
              echo "PREFIX_SCRIPT=scripts/build_erpnext_multiwarehouse_prefix.py" >> "$GITHUB_ENV"
              echo "FAILURE_SCRIPT=scripts/run_erpnext_multiwarehouse_failure.py" >> "$GITHUB_ENV"
              echo "CONTROL_SCRIPT=scripts/run_erpnext_multiwarehouse_control.py" >> "$GITHUB_ENV"
              echo "BASELINE_SCRIPT=scripts/run_erpnext_multiwarehouse_baseline.py" >> "$GITHUB_ENV"
              echo "ADMISSION_SCRIPT=scripts/build_erpnext_multiwarehouse_admission.py" >> "$GITHUB_ENV"
              echo "BASELINES=no_op blind_retry assume_committed repair_failed_record_only all_rollback duplicate_second_leg cancel_protected_reservation" >> "$GITHUB_ENV"
              ;;
            sales_return)
              echo "PREFIX_SCRIPT=scripts/build_erpnext_sales_return_prefix.py" >> "$GITHUB_ENV"
              echo "FAILURE_SCRIPT=scripts/run_erpnext_sales_return_failure.py" >> "$GITHUB_ENV"
              echo "CONTROL_SCRIPT=scripts/run_erpnext_sales_return_control.py" >> "$GITHUB_ENV"
              echo "BASELINE_SCRIPT=scripts/run_erpnext_sales_return_baseline.py" >> "$GITHUB_ENV"
              echo "ADMISSION_SCRIPT=scripts/build_native_sales_return_admission.py" >> "$GITHUB_ENV"
              echo "BASELINES=no_op blind_retry assume_committed repair_failed_record_only all_rollback cancel_shared_payment compact_boundary_tree" >> "$GITHUB_ENV"
              ;;
            *) exit 2 ;;
          esac
          echo "RUN_ROOT=$RUNNER_TEMP/erpnext-hidden" >> "$GITHUB_ENV"

      - name: Materialize and validate the private instance without model credentials
        run: |
          mkdir -p "$RUN_ROOT/private/runtime" \
            "$RUN_ROOT/private/baselines" \
            "$RUN_ROOT/private/bundles" \
            "$RUN_ROOT/private/logs" \
            "$RUN_ROOT/public"
          if [ "$SELECTED_FAMILY" = sales_return ]
          then
            python scripts/generate_erpnext_sales_return_hidden_instance.py \
              --instance-id "$SELECTED_INSTANCE_ID" \
              --output "$RUN_ROOT/private/instance.json" \
              > "$RUN_ROOT/private/logs/instance-generation.log" 2>&1
            python scripts/verify_erpnext_sales_return_instance_novelty.py \
              --instance-spec "$RUN_ROOT/private/instance.json" \
              > "$RUN_ROOT/private/logs/novelty.log" 2>&1
            python scripts/render_erpnext_sales_return_blueprint.py \
              --instance-spec "$RUN_ROOT/private/instance.json" \
              --output "$RUN_ROOT/private/blueprint.json" \
              --instance-id "$SELECTED_INSTANCE_ID" \
              --benchmark-split hidden_test \
              > "$RUN_ROOT/private/logs/render.log" 2>&1
          else
            test -n "$HIDDEN_INSTANCE_B64"
            printf '%s' "$HIDDEN_INSTANCE_B64" \
              | base64 --decode > "$RUN_ROOT/private/instance.json"
            python scripts/verify_erpnext_instance_novelty.py \
              --instance-spec "$RUN_ROOT/private/instance.json" \
              > "$RUN_ROOT/private/logs/novelty.log" 2>&1
            python scripts/render_erpnext_native_blueprint.py \
              --instance-spec "$RUN_ROOT/private/instance.json" \
              --template "$TEMPLATE" \
              --output "$RUN_ROOT/private/blueprint.json" \
              --instance-id "$SELECTED_INSTANCE_ID" \
              --benchmark-split hidden_test \
              > "$RUN_ROOT/private/logs/render.log" 2>&1
          fi
          python scripts/verify_hidden_evaluation_novelty.py \
            --scenario "$RUN_ROOT/private/blueprint.json" \
            --registry-root data/diagnostics \
            > "$RUN_ROOT/private/logs/hidden-novelty.log" 2>&1
          python -m unittest discover -s tests \
            -p 'test_erpnext_native_instances.py' -v

      - name: Build pinned ERPNext and Frappe from source
        run: |
          python scripts/build_erpnext_runtime.py \
            --source-directory "$RUNNER_TEMP/frappe_docker" \
            --execute \
            --report "$RUN_ROOT/private/source-verification.json"

      - name: Build and snapshot the native prefix
        run: |
          runtime_root="runtimes/erpnext/.runtime"
          python scripts/manage_erpnext_stack.py up
          python scripts/manage_erpnext_stack.py setup
          cp "$runtime_root/credentials.json" \
            "$RUN_ROOT/private/runtime/credentials.json"
          if ! python "$PREFIX_SCRIPT" \
            --scenario "$RUN_ROOT/private/blueprint.json" \
            --credentials "$runtime_root/credentials.json" \
            --output "$RUN_ROOT/private/runtime/prefix.json" \
            > "$RUN_ROOT/private/logs/prefix.log" 2>&1
          then
            python - "$RUN_ROOT/private/logs/prefix.log" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          types = sorted(set(re.findall(r"\b([A-Z][A-Za-z]+(?:Error|Exception))\b", text)))
          codes = sorted(set(re.findall(r"\b(?:HTTP|status)[ :=]+([0-9]{3})\b", text, re.I)))
          print(
              "::error title=ERPNext hidden prefix failed::"
              f"exception_types={','.join(types[-6:]) or 'none'};"
              f"http_codes={','.join(codes[-4:]) or 'none'}"
          )
          PY
            exit 1
          fi
          python scripts/manage_erpnext_stack.py snapshot-bundle \
            --snapshot "$RUN_ROOT/private/bundles/prefix"

      - name: Replay every boundary, reference, and fixed policy
        run: |
          runtime_root="runtimes/erpnext/.runtime"
          run_private() {
            label="$1"
            log="$2"
            shift 2
            if ! "$@" > "$log" 2>&1
            then
              echo "::error title=ERPNext hidden replay failed::$label"
              case "$label" in
                reference:*)
                  variant="${label#reference:}"
                  report="$RUN_ROOT/private/runtime/$variant-reference.json"
                  if [ -s "$report" ]
                  then
                    python - "$report" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          control_error = report.get("control_error") or {}
          exception_type = control_error.get("exception_type", "none")
          failed_checks = ",".join(report.get("evaluation", {}).get("failures", []))
          print(
              "::notice title=ERPNext hidden reference diagnostics::"
              f"exception_type={exception_type};failed_checks={failed_checks or 'none'}"
          )
          PY
                  fi
                  ;;
              esac
              return 1
            fi
          }
          variants=(
            request_not_reached
            database_committed_response_lost
            after_commit_enqueue_failed
            async_job_pending
          )
          read -r -a baselines <<< "$BASELINES"
          for variant in "${variants[@]}"
          do
            run_private "boundary:$variant" \
              "$RUN_ROOT/private/logs/$variant-boundary.log" \
              python "$FAILURE_SCRIPT" \
              --variant "$variant" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/private/runtime/prefix.json" \
              --snapshot-bundle "$RUN_ROOT/private/bundles/prefix" \
              --output "$RUN_ROOT/private/runtime/$variant.json"
            python scripts/manage_erpnext_stack.py snapshot-bundle \
              --snapshot "$RUN_ROOT/private/bundles/boundary-$variant"
            python scripts/manage_erpnext_stack.py restore-bundle \
              --snapshot "$RUN_ROOT/private/bundles/boundary-$variant"
            run_private "reference:$variant" \
              "$RUN_ROOT/private/logs/$variant-reference.log" \
              python "$CONTROL_SCRIPT" \
              --variant "$variant" \
              --credentials "$runtime_root/credentials.json" \
              --prefix "$RUN_ROOT/private/runtime/prefix.json" \
              --output "$RUN_ROOT/private/runtime/$variant-reference.json"
            for baseline in "${baselines[@]}"
            do
              python scripts/manage_erpnext_stack.py restore-bundle \
                --snapshot "$RUN_ROOT/private/bundles/boundary-$variant"
              run_private "baseline:$variant:$baseline" \
                "$RUN_ROOT/private/logs/$variant-baseline-$baseline.log" \
                python "$BASELINE_SCRIPT" \
                --baseline "$baseline" \
                --variant "$variant" \
                --credentials "$runtime_root/credentials.json" \
                --prefix "$RUN_ROOT/private/runtime/prefix.json" \
                --output "$RUN_ROOT/private/runtime/$variant-baseline-$baseline.json"
            done
          done

      - name: Admit and freeze before any provider request
        run: |
          mkdir -p "$RUN_ROOT/post-freeze-logs"
          run_private() {
            label="$1"
            log="$2"
            shift 2
            if ! "$@" > "$log" 2>&1
            then
              echo "::error title=ERPNext hidden freeze failed::$label"
              return 1
            fi
          }
          if [ "$SELECTED_FAMILY" = sales_return ]
          then
            run_private "admission-build" \
              "$RUN_ROOT/private/logs/admission.log" \
              python "$ADMISSION_SCRIPT" \
              --prefix "$RUN_ROOT/private/runtime/prefix.json" \
              --control-directory "$RUN_ROOT/private/runtime" \
              --blueprint "$RUN_ROOT/private/blueprint.json" \
              --output-directory "$RUN_ROOT/private/scenario"
          else
            run_private "admission-build" \
              "$RUN_ROOT/private/logs/admission.log" \
              python "$ADMISSION_SCRIPT" \
              --runtime-directory "$RUN_ROOT/private/runtime" \
              --blueprint "$RUN_ROOT/private/blueprint.json" \
              --output-directory "$RUN_ROOT/private/scenario"
          fi
          run_private "scenario-validation" \
            "$RUN_ROOT/private/logs/scenario-validation.log" \
            python -m aftermath_bench validate-native-scenario \
            --scenario "$RUN_ROOT/private/scenario/scenario.json"
          runtime_revision="$(python -c 'import json; print(json.load(open("runtimes/erpnext/runtime.lock.json"))["erpnext"]["revision"])')"
          run_private "bundle-freeze" \
            "$RUN_ROOT/post-freeze-logs/freeze.log" \
            python scripts/freeze_native_bundle.py \
            --bundle-root "$RUN_ROOT/private" \
            --scenario "$RUN_ROOT/private/scenario/scenario.json" \
            --instance-spec "$RUN_ROOT/private/instance.json" \
            --source-commit "$GITHUB_SHA" \
            --runtime-revision "$runtime_revision" \
            --private-attestation "$RUN_ROOT/private/freeze.json" \
            --public-commitment "$RUN_ROOT/private/public-commitment.json" \
            --usage-ledger "$RUN_ROOT/private/usage-ledger.json"
          run_private "hidden-eligibility" \
            "$RUN_ROOT/post-freeze-logs/hidden-eligibility.log" \
            python scripts/verify_hidden_test_eligibility.py \
            --scenario "$RUN_ROOT/private/scenario/scenario.json" \
            --freeze "$RUN_ROOT/private/freeze.json" \
            --usage-ledger "$RUN_ROOT/private/usage-ledger.json"
          cp "$RUN_ROOT/private/public-commitment.json" \
            "$RUN_ROOT/public/pre-model-commitment.json"
          run_private "public-summary" \
            "$RUN_ROOT/post-freeze-logs/summary.log" \
            python scripts/summarize_frozen_candidate.py \
            --commitment "$RUN_ROOT/private/public-commitment.json" \
            --admission "$RUN_ROOT/private/scenario/artifacts/admission.json" \
            --reference "$RUN_ROOT/private/scenario/artifacts/reference.json" \
            --baselines "$RUN_ROOT/private/scenario/artifacts/baselines.json" \
            --usage-ledger "$RUN_ROOT/private/usage-ledger.json" \
            --output "$RUN_ROOT/public/result.json"

      - name: Seal unseen private state
        env:
          HIDDEN_BUNDLE_ENCRYPTION_KEY: ${{ secrets.HIDDEN_BUNDLE_ENCRYPTION_KEY }}
        run: |
          test -n "$HIDDEN_BUNDLE_ENCRYPTION_KEY"
          archive="$RUNNER_TEMP/erpnext-hidden-private.tar.gz"
          ciphertext="$RUN_ROOT/public/hidden-bundle.tar.gz.enc"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -czf "$archive" -C "$RUN_ROOT" private
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:HIDDEN_BUNDLE_ENCRYPTION_KEY \
            -in "$archive" -out "$ciphertext"
          python - \
            "$RUN_ROOT/private/public-commitment.json" \
            "$ciphertext" \
            "$RUN_ROOT/public/sealed-bundle.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          commitment = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          ciphertext = Path(sys.argv[2])
          payload = {
              "schema_version": "1.0",
              "lifecycle_status": "frozen_unseen",
              "source_commit": os.environ["GITHUB_SHA"],
              "source_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "public_commitment_sha256": commitment[
                  "public_commitment_sha256"
              ],
              "cipher": "aes-256-cbc-pbkdf2-sha256",
              "pbkdf2_iterations": 200000,
              "ciphertext_file": ciphertext.name,
              "ciphertext_sha256": hashlib.sha256(
                  ciphertext.read_bytes()
              ).hexdigest(),
          }
          Path(sys.argv[3]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          rm -f "$archive"

      - name: Upload commitment and encrypted bundle only
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-${{ env.SELECTED_FAMILY }}-${{ env.SELECTED_INSTANCE_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/erpnext-hidden/public/
          if-no-files-found: error
          retention-days: 90

      - name: Register a safe sales-return frozen-hidden receipt
        if: ${{ github.event_name == 'push' && env.SELECTED_FAMILY == 'sales_return' }}
        run: |
          receipt="data/evidence/hidden-freeze/erpnext-sales-return-$SELECTED_INSTANCE_ID.json"
          test ! -e "$receipt"
          python - \
            "$RUN_ROOT/public/pre-model-commitment.json" \
            "$RUN_ROOT/public/sealed-bundle.json" \
            "$RUN_ROOT/public/result.json" \
            "$receipt" \
            data/frozen_hidden_candidates.json \
            "$SELECTED_INSTANCE_ID" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          commitment_path, sealed_path, result_path, receipt_path, registry_path, instance_id = (
              Path(item) if index < 5 else item
              for index, item in enumerate(sys.argv[1:])
          )
          commitment = json.loads(commitment_path.read_text(encoding="utf-8"))
          sealed = json.loads(sealed_path.read_text(encoding="utf-8"))
          result = json.loads(result_path.read_text(encoding="utf-8"))
          receipt = {
              "schema_version": "1.0",
              "artifact": {
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "url": "https://github.com/fengyw23/AftermathBench/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              },
              "file_sha256": {
                  "result": hashlib.sha256(result_path.read_bytes()).hexdigest(),
                  "pre_model_commitment": hashlib.sha256(commitment_path.read_bytes()).hexdigest(),
                  "sealed_bundle": hashlib.sha256(sealed_path.read_bytes()).hexdigest(),
              },
              "commitment": commitment,
              "sealed_bundle": sealed,
              "result": result,
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          registry["records"].append({
              "formal_slot_id": "erpnext/erpnext-sales-return-exchange-reconciliation/" + instance_id,
              "scenario_id": commitment["scenario_id"],
              "domain_id": "erpnext",
              "family_id": "erpnext-sales-return-exchange-reconciliation",
              "instance_id": instance_id,
              "variant_count": result["reference"]["case_count"],
              "freeze_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "public_commitment_sha256": commitment["public_commitment_sha256"],
              "artifact_url": receipt["artifact"]["url"],
              "evidence_path": receipt_path.as_posix(),
              "evidence_sha256": hashlib.sha256(receipt_path.read_bytes()).hexdigest(),
          })
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          python -m unittest discover -s tests -p 'test_frozen_hidden_registry.py' -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$receipt" data/frozen_hidden_candidates.json
          git commit -m "evidence(erpnext): register frozen sales-return $SELECTED_INSTANCE_ID"
          git push

      - name: Purge plaintext hidden state and runtime
        if: always()
        run: |
          rm -f runtimes/erpnext/.runtime/credentials.json
          python scripts/manage_erpnext_stack.py purge || true
          rm -rf "$RUNNER_TEMP/erpnext-hidden/private"
