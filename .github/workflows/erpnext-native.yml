name: erpnext-native-runtime

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Failure variant to replay, or all for formal validation
        required: true
        default: all
        type: choice
        options:
          - all
          - request_not_reached
          - database_committed_response_lost
          - after_commit_enqueue_failed
          - async_job_pending

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      AFTERMATH_DB_ROOT_PASSWORD: aftermath-root
      AFTERMATH_ADMIN_PASSWORD: aftermath-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate component code and runtime declarations
        run: |
          python -m unittest discover -s tests -v
          python -m aftermath_bench validate-runtimes

      - name: Build pinned ERPNext and Frappe from source
        run: |
          python scripts/build_erpnext_runtime.py \
            --source-directory "$RUNNER_TEMP/frappe_docker" \
            --execute

      - name: Start native services and initialize the site
        run: |
          python scripts/manage_erpnext_stack.py up
          python scripts/manage_erpnext_stack.py setup

      - name: Create the seven-write prefix through public APIs
        run: |
          python scripts/build_erpnext_prefix.py \
            --credentials runtimes/erpnext/.runtime/credentials.json \
            --output runtimes/erpnext/.runtime/prefix.json
          python scripts/manage_erpnext_stack.py snapshot \
            --snapshot runtimes/erpnext/.runtime/prefix.sql

      - name: Replay all four source-supported failure boundaries
        run: |
          replay_status=0
          variants=(
            request_not_reached
            database_committed_response_lost
            after_commit_enqueue_failed
            async_job_pending
          )
          if [ "${{ inputs.variant }}" != "all" ]; then
            variants=("${{ inputs.variant }}")
          fi
          for variant in "${variants[@]}"
          do
            if python scripts/run_erpnext_failure.py \
                --variant "$variant" \
                --credentials runtimes/erpnext/.runtime/credentials.json \
                --prefix runtimes/erpnext/.runtime/prefix.json \
                --snapshot runtimes/erpnext/.runtime/prefix.sql \
                --output "runtimes/erpnext/.runtime/${variant}.json"
            then
              python scripts/run_erpnext_recovery_control.py \
                --variant "$variant" \
                --credentials runtimes/erpnext/.runtime/credentials.json \
                --prefix runtimes/erpnext/.runtime/prefix.json \
                --output "runtimes/erpnext/.runtime/${variant}_recovery.json" \
                || replay_status=1
            else
              replay_status=1
            fi
          done
          exit "$replay_status"

      - name: Capture compose diagnostics
        if: always()
        run: |
          mkdir -p runtimes/erpnext/.runtime
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            ps --all \
            > runtimes/erpnext/.runtime/compose-ps.txt 2>&1 || true
          docker compose \
            --project-name aftermath-erpnext \
            --file runtimes/erpnext/compose.yaml \
            logs --no-color \
            > runtimes/erpnext/.runtime/compose.log 2>&1 || true
          tail -n 500 runtimes/erpnext/.runtime/compose.log || true

      - name: Remove ephemeral API credentials
        if: always()
        run: rm -f runtimes/erpnext/.runtime/credentials.json

      - name: Upload native-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-native-runtime-evidence
          include-hidden-files: true
          path: |
            runtimes/erpnext/.runtime/prefix.json
            runtimes/erpnext/.runtime/request_not_reached.json
            runtimes/erpnext/.runtime/database_committed_response_lost.json
            runtimes/erpnext/.runtime/after_commit_enqueue_failed.json
            runtimes/erpnext/.runtime/async_job_pending.json
            runtimes/erpnext/.runtime/request_not_reached_recovery.json
            runtimes/erpnext/.runtime/database_committed_response_lost_recovery.json
            runtimes/erpnext/.runtime/after_commit_enqueue_failed_recovery.json
            runtimes/erpnext/.runtime/async_job_pending_recovery.json
            runtimes/erpnext/.runtime/*.txt
            runtimes/erpnext/.runtime/*.log
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        run: python scripts/manage_erpnext_stack.py purge
