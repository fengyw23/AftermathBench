name: kubernetes-interaction-model

# The two dedicated branches keep execution control and ordinary evaluation
# separate in immutable GitHub run metadata. The workflow is not enabled on the
# development branch, so validating task construction never spends model quota.
on:
  push:
    branches:
      - interaction-model-control
      - interaction-model-eval
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible model identifier
        required: true
        default: glm-5.2
        type: string
      repetitions:
        description: Repetitions for each matched state
        required: true
        default: "1"
        type: string
      execution_control:
        description: Supply the target state to isolate tool execution
        required: true
        default: false
        type: boolean
      variants:
        description: Optional comma-separated subset for infrastructure retries
        required: false
        default: ""
        type: string
      model_timeout_seconds:
        description: Provider read timeout; increase only for infrastructure retries
        required: true
        default: "600"
        type: string
      model_stream:
        description: Use provider SSE streaming for long-response retries
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-interaction-model:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      AFTERMATH_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
      AFTERMATH_MODEL_BASE_URL: https://ws-ogjwl5f71op9q2jf.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      SCENARIO: data/scenarios/k8s-constraint-interactions-dev-005/scenario.json
      CONTROL_MIN_PASS_RATE: "0.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Resolve immutable experiment configuration
        run: |
          test -n "$AFTERMATH_API_KEY"
          requested_model="${{ inputs.model }}"
          requested_repetitions="${{ inputs.repetitions }}"
          requested_control="${{ inputs.execution_control }}"
          requested_variants="${{ inputs.variants }}"
          requested_timeout="${{ inputs.model_timeout_seconds }}"
          requested_stream="${{ inputs.model_stream }}"
          test -n "$requested_model" || requested_model=glm-5.2
          test -n "$requested_repetitions" || requested_repetitions=1
          test -n "$requested_timeout" || requested_timeout=600
          test -n "$requested_stream" || requested_stream=false
          case "$requested_timeout" in
            600|1200|1800) ;;
            *) echo "unsupported provider timeout: $requested_timeout" >&2; exit 2 ;;
          esac
          case "$requested_stream" in
            true|false) ;;
            *) echo "unsupported stream flag: $requested_stream" >&2; exit 2 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" = "interaction-model-control" ]; then
              requested_control=true
            else
              requested_control=false
            fi
          fi
          test -n "$requested_control" || requested_control=false
          echo "MODEL_ID=$requested_model" >> "$GITHUB_ENV"
          echo "REPETITIONS=$requested_repetitions" >> "$GITHUB_ENV"
          echo "EXECUTION_CONTROL=$requested_control" >> "$GITHUB_ENV"
          echo "VARIANT_SUBSET=$requested_variants" >> "$GITHUB_ENV"
          echo "MODEL_TIMEOUT_SECONDS=$requested_timeout" >> "$GITHUB_ENV"
          echo "MODEL_STREAM=$requested_stream" >> "$GITHUB_ENV"
          python -m unittest discover -s tests -p 'test_kubernetes_interaction*.py' -v
          python -m unittest discover -s tests -p 'test_native_kubernetes_interaction_family.py' -v

      - name: Build pinned kind and install pinned kubectl
        run: |
          git clone --no-checkout https://github.com/kubernetes-sigs/kind.git "$RUNNER_TEMP/kind"
          git -C "$RUNNER_TEMP/kind" fetch --depth 1 origin 9a205e8c8540557602240f8766d3c95c51c23c4c
          git -C "$RUNNER_TEMP/kind" checkout --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/kind" && go build -trimpath -o "$RUNNER_TEMP/bin/kind" .)
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/kubectl.sha256" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/bin/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Start native Kubernetes and registry
        run: |
          python scripts/manage_kubernetes_stack.py up
          docker build --file runtimes/forgejo/control/Containerfile \
            --tag aftermathbench/kubernetes-control:local .
          kind load docker-image --name aftermath-kubernetes aftermathbench/kubernetes-control:local
          docker run --detach --rm --name aftermath-interaction-registry \
            --publish 127.0.0.1:9092:8080 aftermathbench/kubernetes-control:local \
            python -m runtime_services.webhook_sink
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9092/health && break
            sleep 1
          done
          run_root="$RUNNER_TEMP/kubernetes-interaction-model"
          mkdir -p "$run_root/model-runs"
          printf '{}\n' > "$run_root/credentials.json"
          {
            echo "schema_version=0.1"
            echo "commit=$GITHUB_SHA"
            echo "provider=bailian-openai-compatible"
            echo "base_url=$AFTERMATH_MODEL_BASE_URL"
            echo "model=$MODEL_ID"
            echo "repetitions=$REPETITIONS"
            echo "execution_control=$EXECUTION_CONTROL"
            echo "control_min_pass_rate=$CONTROL_MIN_PASS_RATE"
          } > "$run_root/manifest.txt"

      - name: Run matched interaction states
        run: |
          run_status=0
          run_root="$RUNNER_TEMP/kubernetes-interaction-model"
          variants=(
            state_01 state_02 state_03 state_04 state_05 state_06 state_07
            state_08 state_09 state_10 state_11 state_12 state_13
          )
          if [ -n "$VARIANT_SUBSET" ]; then
            IFS=',' read -r -a variants <<< "$VARIANT_SUBSET"
            allowed=" state_01 state_02 state_03 state_04 state_05 state_06 state_07 state_08 state_09 state_10 state_11 state_12 state_13 "
            for variant in "${variants[@]}"; do
              if [[ "$allowed" != *" $variant "* ]]; then
                echo "unknown variant in retry subset: $variant" >&2
                exit 2
              fi
            done
          fi
          for repetition in $(seq 1 "$REPETITIONS"); do
            run_dir="$run_root/model-runs/repetition-$(printf '%02d' "$repetition")"
            mkdir -p "$run_dir"
            for variant in "${variants[@]}"; do
              control_flag=()
              stream_flag=()
              if [ "$EXECUTION_CONTROL" = "true" ]; then
                control_flag=(--execution-control)
              fi
              if [ "$MODEL_STREAM" = "true" ]; then
                stream_flag=(--model-stream)
              fi
              model_completed=false
              for attempt in 1 2 3; do
                # A provider timeout can occur after tool mutations. Recreate
                # the boundary before every retry so the accepted trajectory is
                # scored against exactly the effects it records.
                rm -f "$run_dir/${variant}.json"
                python scripts/run_kubernetes_interaction_boundary.py \
                  --variant "$variant" \
                  --prefix-output "$run_root/prefix.json" \
                  --output "$run_dir/${variant}-failure.json"
                if python -m aftermath_bench run-native-model \
                    --provider openai-compatible \
                    --base-url "$AFTERMATH_MODEL_BASE_URL" \
                    --model "$MODEL_ID" \
                    --scenario "$SCENARIO" \
                    --credentials "$run_root/credentials.json" \
                    --prefix "$run_root/prefix.json" \
                    --failure-report "$run_dir/${variant}-failure.json" \
                    --model-timeout-seconds "$MODEL_TIMEOUT_SECONDS" \
                    --max-turns 30 "${control_flag[@]}" "${stream_flag[@]}" \
                    --output "$run_dir/${variant}.json"; then
                  model_completed=true
                  break
                fi
                if [ -s "$run_dir/${variant}.json" ]; then
                  echo "model trajectory completed with a scored failure for $variant"
                  model_completed=true
                  break
                fi
                echo "provider/runtime attempt $attempt failed for $variant"
              done
              if [ "$model_completed" != "true" ]; then run_status=1; fi
            done
          done
          summary_scope=(--scenario "$SCENARIO")
          if [ -n "$VARIANT_SUBSET" ]; then
            summary_scope=()
            for variant in "${variants[@]}"; do
              summary_scope+=(--expected-variant "$variant")
            done
          fi
          python scripts/summarize_native_model_runs.py \
            --run-directory "$run_root/model-runs" \
            "${summary_scope[@]}" \
            --output "$run_root/model-runs/summary.json" \
            --expected-execution-control "$EXECUTION_CONTROL" || run_status=1
          if [ "$EXECUTION_CONTROL" = "true" ] && [ -z "$VARIANT_SUBSET" ]; then
            if ! python - "$run_root/model-runs/summary.json" "$CONTROL_MIN_PASS_RATE" <<'PY'
          import json
          import sys

          summary_path, threshold_text = sys.argv[1:]
          with open(summary_path, encoding="utf-8") as handle:
              summary = json.load(handle)
          observed = float(summary["task_pass_rate"])
          threshold = float(threshold_text)
          print(
              "execution-control scientific gate: "
              f"observed={observed:.6f}, required={threshold:.6f}"
          )
          if observed < threshold:
              raise SystemExit(1)
          PY
            then
              run_status=1
            fi
          fi
          rm -f "$run_root/credentials.json"
          exit "$run_status"

      - name: Upload model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-interaction-model-${{ github.run_id }}
          path: ${{ runner.temp }}/kubernetes-interaction-model/

      - name: Purge native services
        if: always()
        run: |
          docker rm --force aftermath-interaction-registry || true
          python scripts/manage_kubernetes_stack.py down || true
