x-forgejo-image: &forgejo_image
  image: ${AFTERMATH_FORGEJO_IMAGE:-aftermathbench/forgejo:fbafae6c}
  pull_policy: never

x-control-image: &control_image
  build:
    context: ../..
    dockerfile: runtimes/forgejo/control/Containerfile

x-runner-image: &runner_image
  image: aftermathbench/forgejo-runner:9.1.1-node22
  pull_policy: never
  build:
    context: ../..
    dockerfile: runtimes/forgejo/runner/Containerfile

services:
  forgejo:
    <<: *forgejo_image
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/forgejo.db
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__repository__DEFAULT_REPO_UNITS: "repo.code,repo.releases,repo.issues,repo.pulls,repo.packages,repo.actions"
      FORGEJO__server__DOMAIN: forgejo
      FORGEJO__server__HTTP_PORT: "3000"
      # Actions returns artifact upload URLs derived from ROOT_URL.  This must be
      # reachable from the isolated runner container, not only from the host.
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/api/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40

  runner-register:
    <<: *runner_image
    profiles: ["runner-setup"]
    user: "1000:1000"
    working_dir: /data
    volumes:
      - forgejo-runner-data:/data
    depends_on:
      forgejo:
        condition: service_healthy

  runner-daemon:
    <<: *runner_image
    user: "1000:1000"
    working_dir: /data
    command:
      - sh
      - -ec
      - |
        while [ ! -s /data/.runner ] || [ ! -s /data/config.yml ]; do sleep 1; done
        exec forgejo-runner --config /data/config.yml daemon
    volumes:
      - forgejo-runner-data:/data
    depends_on:
      forgejo:
        condition: service_healthy

  deployment-target:
    <<: *control_image
    command: ["python", "-m", "runtime_services.deployment_target"]
    environment:
      AFTERMATH_DEPLOYMENT_DB: /data/deployment-target.sqlite3
    volumes:
      - deployment-target-data:/data
    ports:
      - "127.0.0.1:9095:8080"

  deployment-fault-gateway:
    <<: *control_image
    command: ["python", "-m", "runtime_services.gateway"]
    environment:
      AFTERMATH_GATEWAY_UPSTREAM: http://deployment-target:8080
      AFTERMATH_GATEWAY_DB: /data/deployment-gateway.sqlite3
    volumes:
      - deployment-gateway-audit:/data
    ports:
      - "127.0.0.1:9096:8081"
    depends_on:
      - deployment-target

  api-fault-gateway:
    <<: *control_image
    command: ["python", "-m", "runtime_services.gateway"]
    environment:
      AFTERMATH_GATEWAY_UPSTREAM: http://forgejo:3000
      AFTERMATH_GATEWAY_DB: /data/gateway.sqlite3
    volumes:
      - api-gateway-audit:/data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9091:8081"
    depends_on:
      forgejo:
        condition: service_healthy

  webhook-sink:
    <<: *control_image
    command: ["python", "-m", "runtime_services.webhook_sink"]
    environment:
      AFTERMATH_WEBHOOK_SINK_DB: /data/webhook-sink.sqlite3
    volumes:
      - webhook-sink-audit:/data
    ports:
      - "127.0.0.1:9092:8080"

  webhook-fault-gateway:
    <<: *control_image
    command: ["python", "-m", "runtime_services.gateway"]
    environment:
      AFTERMATH_GATEWAY_UPSTREAM: http://webhook-sink:8080
      AFTERMATH_GATEWAY_DB: /data/gateway.sqlite3
    volumes:
      - webhook-gateway-audit:/data
    ports:
      - "127.0.0.1:9093:8081"
    depends_on:
      - webhook-sink

  provenance-webhook-fault-gateway:
    <<: *control_image
    command: ["python", "-m", "runtime_services.gateway"]
    environment:
      AFTERMATH_GATEWAY_UPSTREAM: http://webhook-sink:8080
      AFTERMATH_GATEWAY_DB: /data/gateway.sqlite3
    volumes:
      - provenance-webhook-gateway-audit:/data
    ports:
      - "127.0.0.1:9094:8081"
    depends_on:
      - webhook-sink

volumes:
  forgejo-data:
  forgejo-runner-data:
  deployment-target-data:
  deployment-gateway-audit:
  api-gateway-audit:
  webhook-sink-audit:
  webhook-gateway-audit:
  provenance-webhook-gateway-audit:
