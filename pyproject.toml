[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aftermath-bench"
version = "0.1.0"
description = "Benchmarking integrity-preserving recovery after ambiguous tool side effects."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
  {name = "AftermathBench Contributors"}
]
dependencies = []

[project.scripts]
aftermath-bench = "aftermath_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

